# jema12.com → https://jema-ai.com (301, path+query preserved)
# Policy: MKM_DOMAIN_PORTFOLIO_POINTER_V1.md — legacy brand absorbs into jema-ai.com
# Apply: sudo bash scripts/deploy/linux/apply_jema12_redirect_to_jema_ai_nginx_v1.sh

server {
    listen 80;
    listen [::]:80;
    server_name jema12.com www.jema12.com;
    return 301 https://jema-ai.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jema12.com www.jema12.com;

    ssl_certificate /etc/letsencrypt/live/jema12.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jema12.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://jema-ai.com$request_uri;
}
