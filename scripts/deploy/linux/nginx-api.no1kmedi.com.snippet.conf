# Origin on Hostinger VPS only — payapp-api PM2 :3847
# Public edge = Cloudflare. Origin HTTP :80 works when CF proxies to VPS IP.
# TLS: prefer certbot -d api.no1kmedi.com (DNS-only or CF ACME bypass).
# Interim: reuse www.no1kmedi.com cert for origin 443 (SNI api.* — use CF Full not strict, or add api SAN).

server {
    listen 80;
    listen [::]:80;
    server_name api.no1kmedi.com;

    location / {
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.no1kmedi.com;

    ssl_certificate /etc/letsencrypt/live/www.no1kmedi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.no1kmedi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
