      - "scripts/record_mkm_inter_agent_legal_counsel_signoff_v1.py"
      - "scripts/Invoke-MkmInterAgentCounselSubmissionParallel_v1.ps1"
      - "scripts/run_mkm_cmp2_011_v2_routing_ab_v1.py"
      - "tests/test_run_mkm_inter_agent_dialogue_routing_compare_v1.py"
      - "tests/test_compression_v2_routing_profile_v1.py"
      - "tests/test_record_mkm_inter_agent_health_commander_approval_v1.py"
      - "tests/test_build_mkm_inter_agent_health_signoff_candidate_v1.py"
      - "tests/test_build_mkm_inter_agent_post_commander_approval_bundle_v1.py"
      - "tests/test_build_mkm_inter_agent_legal_handoff_pack_v1.py"
      - "tests/test_mkm_cmp2_011_v2_routing_ab_v1.py"
      - "codebook/shards/zone_g_health.json"
      - "docs/final/openapi_token_compression_v2_draft.yaml"
      - "docs/final/artifacts/mkm_inter_agent_*"
      - "docs/final/artifacts/fixtures/mkm_inter_agent_*"
      - ".github/workflows/inter-agent-encoding-smoke.yml"
  pull_request:
    paths:
      - "scripts/compression_token_api_v2_stub.py"
      - "scripts/build_mkm_inter_agent_encoding_status_v1.py"
      - "scripts/emit_mkm_inter_agent_first_message_worked_example_v1.py"
      - "tests/test_compression_token_api_v2_stub.py"
      - "tests/test_build_mkm_inter_agent_encoding_status_v1.py"
