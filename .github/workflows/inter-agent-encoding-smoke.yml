      - "docs/final/artifacts/mkm_inter_agent_*"
      - "docs/final/artifacts/fixtures/mkm_inter_agent_*"
      - ".github/workflows/inter-agent-encoding-smoke.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install pytest fastapi httpx pydantic uvicorn numpy

      - name: Inter-agent encoding tests
        run: |
          pytest \
            tests/test_compression_token_api_v2_stub.py \
            tests/test_build_mkm_inter_agent_encoding_status_v1.py \
            tests/test_emit_mkm_inter_agent_first_message_worked_example_v1.py \
            tests/test_run_mkm_inter_agent_dialogue_mock_v1.py \
            tests/test_compression_v2_routing_profile_v1.py \
            tests/test_run_mkm_inter_agent_dialogue_routing_compare_v1.py \
            tests/test_record_mkm_inter_agent_health_commander_approval_v1.py \
            tests/test_build_mkm_inter_agent_health_signoff_candidate_v1.py \
            tests/test_build_mkm_inter_agent_post_commander_approval_bundle_v1.py \
            tests/test_build_mkm_inter_agent_legal_handoff_pack_v1.py \
            tests/test_mkm_inter_agent_counsel_submission_v1.py \
            tests/test_mkm_cmp2_011_v2_routing_ab_v1.py \
            -q \
            -m "not slow"

      - name: L1 experimental expand (slow)
        run: pytest tests/test_compression_token_api_v2_stub.py::test_v2_expand_l1_experimental_mode_research_only -q

      - name: Status builder (strict)
        run: python scripts/build_mkm_inter_agent_encoding_status_v1.py --strict-exit
