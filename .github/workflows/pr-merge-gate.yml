name: PR Merge Gate

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  pr-merge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stable required-check heartbeat
        run: |
          echo "PR merge gate check is healthy."
