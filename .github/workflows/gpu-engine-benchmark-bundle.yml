# Build unified cpu/numba/cuda benchmark bundle (manual dispatch only).
name: GPU engine benchmark bundle

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

on:
  schedule:
    # Weekly at 02:30 UTC on Sunday (cost-optimized)
    - cron: "30 2 * * 0"
  workflow_dispatch:
    inputs:
      btc_start:
        description: "BTC benchmark start date (YYYY-MM-DD)"
        required: false
        default: "2026-03-20"
        type: string
      btc_end:
        description: "BTC benchmark end date (YYYY-MM-DD)"
        required: false
        default: "2026-04-18"
        type: string
      prophecy_top_k:
        description: "Top-K candidates to retain in prophecy output"
        required: false
        default: "5"
        type: string
      run_self_hosted_gpu:
        description: "Also run on self-hosted GPU runner"
        required: false
        default: false
        type: boolean
      require_cuda_on_gpu_runner:
        description: "Fail self-hosted job when requested cuda is not used"
        required: false
        default: true
        type: boolean
      max_regression_pct:
        description: "Allowed performance regression percentage vs locked GPU baseline"
        required: false
        default: "10"
        type: string
      sample_count:
        description: "Number of strict GPU benchmark samples (1-9)"
        required: false
        default: "5"
        type: string
      upload_artifacts:
        description: "Upload benchmark artifacts in manual runs"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark_hosted:
    name: benchmark (hosted fallback-allowed)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BENCHMARK_BTC_START: ${{ inputs.btc_start || '2026-03-20' }}
      BENCHMARK_BTC_END: ${{ inputs.btc_end || '2026-04-18' }}
      BENCHMARK_PROPHECY_TOP_K: ${{ inputs.prophecy_top_k || '5' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy pyyaml requests scipy scikit-learn hmmlearn torch
      - name: Run unified benchmark bundle builder
        run: >
          python3 scripts/build_gpu_engine_benchmark_bundle_v1.py
          --btc-start "${{ env.BENCHMARK_BTC_START }}"
          --btc-end "${{ env.BENCHMARK_BTC_END }}"
          --prophecy-top-k "${{ env.BENCHMARK_PROPHECY_TOP_K }}"
      - name: Upload benchmark artifact
        if: ${{ github.event_name == 'schedule' || inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@v6
        with:
          name: gpu-engine-benchmark-bundle-hosted
          retention-days: 7
          path: docs/final/artifacts/gpu_engine_benchmark_bundle_v1_latest.json
      - name: Annotate engine fallback on hosted runner
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("docs/final/artifacts/gpu_engine_benchmark_bundle_v1_latest.json")
          doc = json.loads(p.read_text(encoding="utf-8"))
          mismatches = []
          for run_name, run_doc in (doc.get("runs") or {}).items():
              engine = run_doc.get("engine") or {}
              req = engine.get("requested")
              used = engine.get("used")
              if req and used and req != used:
                  mismatches.append((run_name, req, used))
          if mismatches:
              for run_name, req, used in mismatches:
                  print(f"::warning::{run_name}: requested={req}, used={used} (hosted runner fallback)")
          print(f"hosted_mismatch_count={len(mismatches)}")
          PY

  benchmark_gpu:
    name: benchmark (self-hosted gpu strict)
    if: ${{ github.event_name == 'schedule' || inputs.run_self_hosted_gpu == true }}
    runs-on: [self-hosted, gpu]
    timeout-minutes: 240
    env:
      BENCHMARK_BTC_START: ${{ inputs.btc_start || '2026-03-20' }}
      BENCHMARK_BTC_END: ${{ inputs.btc_end || '2026-04-18' }}
      BENCHMARK_PROPHECY_TOP_K: ${{ inputs.prophecy_top_k || '5' }}
      BENCHMARK_SAMPLE_COUNT: ${{ inputs.sample_count || '5' }}
      BENCHMARK_MAX_REGRESSION_PCT: ${{ inputs.max_regression_pct || '10' }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect Python on self-hosted runner
        run: |
          python --version
          python -m pip --version
      - name: Install dependencies
        run: python -m pip install pandas numpy pyyaml requests scipy scikit-learn hmmlearn torch
      - name: Run unified benchmark bundle builder
        run: >
          python scripts/build_gpu_engine_benchmark_bundle_v1.py
          --btc-start "${{ env.BENCHMARK_BTC_START }}"
          --btc-end "${{ env.BENCHMARK_BTC_END }}"
          --prophecy-top-k "${{ env.BENCHMARK_PROPHECY_TOP_K }}"
      - name: Run repeated GPU benchmark samples (self-hosted)
        run: |
          New-Item -ItemType Directory -Path tmp/gpu-regression-samples -Force | Out-Null
          $sampleCount = [int]"${{ env.BENCHMARK_SAMPLE_COUNT }}"
          if ($sampleCount -lt 1 -or $sampleCount -gt 9) {
            throw "sample_count must be between 1 and 9. got=$sampleCount"
          }
          for ($i = 1; $i -le $sampleCount; $i++) {
            python scripts/build_gpu_engine_benchmark_bundle_v1.py --btc-start "${{ env.BENCHMARK_BTC_START }}" --btc-end "${{ env.BENCHMARK_BTC_END }}" --prophecy-top-k "${{ env.BENCHMARK_PROPHECY_TOP_K }}" --output "tmp/gpu-regression-samples/sample_$i.json"
          }
      - name: Enforce CUDA usage on GPU runner
        if: ${{ inputs.require_cuda_on_gpu_runner == true }}
        run: |
          python -c "import json,pathlib,sys; p=pathlib.Path('docs/final/artifacts/gpu_engine_benchmark_bundle_v1_latest.json'); doc=json.loads(p.read_text(encoding='utf-8')); bad=[]; runs=(doc.get('runs') or {}); [bad.append((name,(run.get('engine') or {}).get('used'))) for name,run in runs.items() if ((run.get('engine') or {}).get('requested')=='cuda' and (run.get('engine') or {}).get('used')!='cuda')]; [print(f'ERROR: {name} expected cuda but used={used}') for name,used in bad]; sys.exit(1 if bad else 0)"
      - name: Check GPU performance regression vs baseline
        run: |
          $sampleCount = [int]"${{ env.BENCHMARK_SAMPLE_COUNT }}"
          if ($sampleCount -lt 1 -or $sampleCount -gt 9) {
            throw "sample_count must be between 1 and 9. got=$sampleCount"
          }
          $bundleArgs = @()
          for ($i = 1; $i -le $sampleCount; $i++) {
            $bundleArgs += @("--bundle", "tmp/gpu-regression-samples/sample_$i.json")
          }
          python scripts/check_gpu_engine_benchmark_regression.py @bundleArgs --baseline docs/final/artifacts/gpu_engine_benchmark_baseline_v1.json --max-regression-pct "${{ github.event_name == 'schedule' && env.BENCHMARK_MAX_REGRESSION_PCT || inputs.max_regression_pct }}"
      - name: Upload benchmark artifact
        if: ${{ always() && (github.event_name == 'schedule' || inputs.upload_artifacts == true) }}
        uses: actions/upload-artifact@v6
        with:
          name: gpu-engine-benchmark-bundle-gpu
          retention-days: 7
          path: |
            docs/final/artifacts/gpu_engine_benchmark_bundle_v1_latest.json
            tmp/gpu-regression-samples/sample_*.json

