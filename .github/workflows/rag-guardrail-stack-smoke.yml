name: RAG Guardrail Stack Smoke

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run guardrail stack smoke
        run: python scripts/run_rag_guardrail_stack_smoke.py

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rag-guardrail-stack-smoke-${{ github.run_id }}
          retention-days: 7
          path: |
            reports/constitution/btrack_pilot/rag_guardrail_stack_smoke_latest.json
            reports/constitution/btrack_pilot/rag_turboquant_guarded_sweep_latest.json
            reports/constitution/btrack_pilot/rag_canary_monitor_latest.json
            reports/constitution/btrack_pilot/rag_canary_rollback_flag_latest.json
            reports/constitution/btrack_pilot/vllm_ab_canary_repeat_latest.json
            reports/constitution/btrack_pilot/vllm_ab_canary_run_*.json
          if-no-files-found: ignore


