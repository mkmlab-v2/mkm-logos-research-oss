name: global-atom-claim-lock-smoke

on:
  push:
    branches: [main]
    paths:
      - "scripts/check_global_atom_claim_lock_v1.py"
      - "scripts/check_global_atom_edge_claim_atom_set_v1.py"
      - "scripts/run_global_atom_claim_lock_daily.ps1"
      - "scripts/Register-GlobalAtomClaimLockDailyTask.ps1"
      - "docs/final/artifacts/global_atom_claim_lock_registry_latest.json"
      - "docs/final/artifacts/global_atom_edge_claim_anchor_v1.json"
      - "docs/final/artifacts/global_atom_edge_claim_atom_set_latest.json"
      - ".github/workflows/global-atom-claim-lock-smoke.yml"
  pull_request:
    paths:
      - "scripts/check_global_atom_claim_lock_v1.py"
      - "scripts/check_global_atom_edge_claim_atom_set_v1.py"
      - "scripts/run_global_atom_claim_lock_daily.ps1"
      - "scripts/Register-GlobalAtomClaimLockDailyTask.ps1"
      - "docs/final/artifacts/global_atom_claim_lock_registry_latest.json"
      - "docs/final/artifacts/global_atom_edge_claim_anchor_v1.json"
      - "docs/final/artifacts/global_atom_edge_claim_atom_set_latest.json"
      - ".github/workflows/global-atom-claim-lock-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Claim lock strict check
        run: python scripts/check_global_atom_claim_lock_v1.py --strict

      - name: Atom set strict check
        run: python scripts/check_global_atom_edge_claim_atom_set_v1.py --strict
