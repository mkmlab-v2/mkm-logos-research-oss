# Validates projects/no1kmedi Next.js app (App Router + API routes compile).
name: no1kmedi-web-build
# Required-check trigger guard: keep path-filter workflow visible to PR checks.

on:
  push:
    paths:
      - "projects/no1kmedi/**"
      - ".github/workflows/no1kmedi-web-build.yml"
      - "scripts/verify_12ai_orchestration_gate.ps1"
  pull_request:
    paths:
      - "projects/no1kmedi/**"
      - ".github/workflows/no1kmedi-web-build.yml"
      - "scripts/verify_12ai_orchestration_gate.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  orchestration-gate:
    if: ${{ vars.ENABLE_GH_ACTIONS_RUNNERS == 'true' }}
    uses: ./.github/workflows/12ai-orchestration-gate.yml
    with:
      role: Architect
      current_metrics_path: docs/final/artifacts/bench_l1_api_load_latest.json
      baseline_metrics_path: docs/final/artifacts/bench_l1_api_load_summary_vps_latest.json
      retries: 3
      action: change_strategy

  build:
    if: ${{ github.event_name == 'pull_request' || vars.ENABLE_GH_ACTIONS_RUNNERS == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: projects/no1kmedi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/no1kmedi/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build


# sync: required-check trigger
