name: no1kmedi Guardian Contract Gate

on:
  pull_request:
    paths:
      - "projects/no1kmedi/src/app/api/guardian/**"
      - "projects/no1kmedi/src/lib/ai-provider.ts"
      - "projects/no1kmedi/src/lib/vertex-gemini.ts"
      - "projects/no1kmedi/src/lib/local-llm.ts"
      - "scripts/validate_no1kmedi_guardian_contracts.py"
      - "scripts/verify_12ai_orchestration_gate.ps1"
      - ".github/workflows/no1kmedi-guardian-contract-gate.yml"
  workflow_dispatch:

jobs:
  orchestration-gate:
    uses: ./.github/workflows/12ai-orchestration-gate.yml
    with:
      role: Architect
      current_metrics_path: docs/final/artifacts/bench_l1_api_load_latest.json
      baseline_metrics_path: docs/final/artifacts/bench_l1_api_load_summary_vps_latest.json
      retries: 3
      action: change_strategy

  guardian-contract-gate:
    needs: orchestration-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate no1kmedi guardian contracts
        run: python scripts/validate_no1kmedi_guardian_contracts.py
