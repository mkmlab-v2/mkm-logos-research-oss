name: no1kmedi Guardian Contract Gate
# Required-check trigger guard: keep path-filter workflow visible to PR checks.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


on:
  pull_request:
  workflow_dispatch:

jobs:
  orchestration-gate:
    uses: ./.github/workflows/12ai-orchestration-gate.yml
    with:
      role: Architect
      current_metrics_path: docs/final/artifacts/bench_l1_api_load_latest.json
      baseline_metrics_path: docs/final/artifacts/bench_l1_api_load_summary_vps_latest.json
      retries: 3
      action: change_strategy

  guardian-contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate no1kmedi guardian contracts
        run: python scripts/validate_no1kmedi_guardian_contracts.py
