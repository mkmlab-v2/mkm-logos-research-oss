name: RAG TurboQuant Canary Monitor

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


on:
  schedule:
    # Every 4 hours UTC (cost-optimized)
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  canary-monitor:
    if: ${{ vars.ENABLE_GH_ACTIONS_RUNNERS == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run canary monitor (short hourly window)
        run: |
          python scripts/run_rag_turboquant_canary_monitor.py \
            --cwd . \
            --iterations 3 \
            --interval-sec 0 \
            --traffic-percent 10 \
            --out-json reports/constitution/btrack_pilot/rag_canary_monitor_latest.json \
            --out-log reports/constitution/btrack_pilot/rag_canary_monitor_log.jsonl

      - name: Evaluate canary guardrail status
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path("reports/constitution/btrack_pilot/rag_canary_monitor_latest.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          ok = bool(d.get("guardrail_status", {}).get("all_passed", False))
          flag = {
            "schema": "rag_turboquant_canary_rollback_flag_v1",
            "should_rollback": (not ok),
            "reason": "guardrail_failed" if not ok else "healthy",
            "source_report": str(p.as_posix()),
          }
          out = Path("reports/constitution/btrack_pilot/rag_canary_rollback_flag_latest.json")
          out.write_text(json.dumps(flag, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"WROTE: {out}")
          if not ok:
            raise SystemExit("Canary guardrail failed; rollback flag raised.")

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rag-turboquant-canary-artifacts
          retention-days: 7
          path: |
            reports/constitution/btrack_pilot/rag_canary_monitor_latest.json
            reports/constitution/btrack_pilot/rag_canary_monitor_log.jsonl
            reports/constitution/btrack_pilot/rag_canary_rollback_flag_latest.json
          if-no-files-found: ignore


