name: Frontline Release Check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Run tag"
        required: false
        type: string
      smoke_only:
        description: "Run smoke-only path"
        required: false
        default: "true"
        type: string
      no_strict_regression:
        description: "Skip strict regression gate"
        required: false
        default: "true"
        type: string
      force_autopilot:
        description: "Force autopilot mode"
        required: false
        default: "true"
        type: string
      trigger_input_mode:
        description: "Trigger mode"
        required: false
        default: "manual"
        type: string
      enable_vllm_canary_gate:
        description: "Enable vLLM canary repeat + rollback gate"
        required: false
        default: "false"
        type: string
      vllm_base_url:
        description: "vLLM OpenAI-compatible base URL"
        required: false
        default: "http://127.0.0.1:8000"
        type: string

jobs:
  remote-ready-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Echo dispatch inputs
        run: |
          echo "tag=${{ github.event.inputs.tag }}"
          echo "smoke_only=${{ github.event.inputs.smoke_only }}"
          echo "no_strict_regression=${{ github.event.inputs.no_strict_regression }}"
          echo "force_autopilot=${{ github.event.inputs.force_autopilot }}"
          echo "trigger_input_mode=${{ github.event.inputs.trigger_input_mode }}"
          echo "enable_vllm_canary_gate=${{ github.event.inputs.enable_vllm_canary_gate }}"
          echo "vllm_base_url=${{ github.event.inputs.vllm_base_url }}"

      - name: vLLM canary repeat (optional)
        if: ${{ github.event.inputs.enable_vllm_canary_gate == 'true' }}
        run: |
          python scripts/run_vllm_ab_canary_repeat.py \
            --base-url "${{ github.event.inputs.vllm_base_url }}" \
            --baseline-model "mkm12-lite" \
            --candidate-model "mkm12-accelerated" \
            --runs 10 \
            --allow-unavailable

      - name: Emit rollback flag from vLLM canary (optional)
        if: ${{ github.event.inputs.enable_vllm_canary_gate == 'true' }}
        run: python scripts/emit_vllm_canary_rollback_flag.py

      - name: RAG TurboQuant canary rollback flag gate
        run: python scripts/check_rag_canary_rollback_flag.py

      - name: Build gate snapshot outputs
        run: |
          mkdir -p artifacts/gate_snapshot
          cat > artifacts/gate_snapshot/frontline_gate_snapshot.json <<'EOF'
          {
            "workflow": "Frontline Release Check",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "trigger": {
              "tag": "${{ github.event.inputs.tag }}",
              "smoke_only": "${{ github.event.inputs.smoke_only }}",
              "no_strict_regression": "${{ github.event.inputs.no_strict_regression }}",
              "force_autopilot": "${{ github.event.inputs.force_autopilot }}",
              "trigger_input_mode": "${{ github.event.inputs.trigger_input_mode }}"
            }
          }
          EOF
          {
            echo "ACT=frontline-release-check SRC=workflow_dispatch TAG=${{ github.event.inputs.tag || 'none' }} D=0 GS=READY G=t/d/g"
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
          } > artifacts/gate_snapshot/frontline_gate_snapshot.txt

      - name: Upload gate snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontline-gate-snapshot-${{ github.run_id }}
          path: artifacts/gate_snapshot
          if-no-files-found: error
