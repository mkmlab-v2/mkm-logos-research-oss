name: MKM Evidence Gate V0

on:
  pull_request:
    paths:
      - "experiments/mkm_orchestrator_v0/**"
      - "tests/test_mkm_evidence_gate_v0.py"
      - "tests/test_mkm_validator_measurement_v0.py"
      - "tests/test_mkm_dogfood_shared_status_v0.py"
      - "tests/test_mkm_shared_status_cli_v0.py"
      - ".github/workflows/mkm-evidence-gate-v0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Compile Evidence Gate package
        run: python -m compileall -q experiments/mkm_orchestrator_v0

      - name: Evidence Gate fresh suites
        run: |
          python -m pytest             tests/test_mkm_evidence_gate_v0.py             tests/test_mkm_validator_measurement_v0.py             tests/test_mkm_dogfood_shared_status_v0.py             -q
