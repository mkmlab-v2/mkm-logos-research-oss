# Regression for showroom JSON validator (Linux; no PowerShell build on CI).
name: Showroom bundle validate

on:
  push:
    branches: [main, master, develop]
    paths:
      - "scripts/validate_showroom_public_bundle.py"
      - "tests/test_validate_showroom_public_bundle.py"
      - ".github/workflows/showroom-bundle-validate.yml"
  pull_request:
    paths:
      - "scripts/validate_showroom_public_bundle.py"
      - "tests/test_validate_showroom_public_bundle.py"
      - ".github/workflows/showroom-bundle-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run showroom validator tests
        run: python -m pytest tests/test_validate_showroom_public_bundle.py -q --tb=short
