# Regression for showroom JSON validator (Linux; no PowerShell build on CI).
name: Showroom bundle validate

on:
  push:
    branches: [main, master, develop]
    paths:
      - "scripts/validate_showroom_public_bundle.py"
      - "scripts/build_showroom_topology_radar_snapshot_v1.py"
      - "scripts/build_showroom_track_c_bundle_chain_v1.ps1"
      - "projects/bitcoin-trading/ops/windows-rehearsal/build_showroom_display_bundle.ps1"
      - "scripts/Invoke-ShowroomTrackCPublishRoutine_v1.ps1"
      - "scripts/Invoke-ShowroomTrackCHealth_v1.ps1"
      - "scripts/Verify-ShowroomTrackCPublishScheduledTask_v1.ps1"
      - "scripts/Verify-ShowroomTrackCNginxWeeklyScheduledTask_v1.ps1"
      - "scripts/Register-ShowroomTrackCPublishDailyTask.ps1"
      - "scripts/Register-ShowroomTrackCNginxWeeklyTask.ps1"
      - "scripts/check_showroom_trust_viz_public_chain_v1.py"
      - "projects/bitcoin-trading/ops/windows-rehearsal/deploy_showroom_static.ps1"
      - "projects/bitcoin-trading/ops/windows-rehearsal/sync_showroom_to_vps.ps1"
      - "projects/bitcoin-trading/ops/windows-rehearsal/jemaai-cloud-mvp/public_showroom_poll.html"
      - "projects/bitcoin-trading/ops/windows-rehearsal/jemaai-cloud-mvp/public_showroom_board_minimal.html"
      - "docs/final/schemas/showroom_topology_radar_snapshot_v1.schema.json"
      - "docs/final/schemas/showroom_topology_radar_snapshot_v1.example.json"
      - "tests/test_validate_showroom_public_bundle.py"
      - "tests/test_showroom_topology_radar_snapshot_schema_v1.py"
      - "tests/test_build_showroom_topology_radar_snapshot_v1.py"
      - "scripts/build_showroom_meaning_topology_graph_slice_v1.py"
      - "scripts/build_showroom_macro_horizon_2030_slice_v1.py"
      - "docs/final/schemas/showroom_macro_horizon_2030_slice_v1.schema.json"
      - "tests/test_build_showroom_macro_horizon_2030_slice_v1.py"
      - "projects/bitcoin-trading/ops/windows-rehearsal/jemaai-cloud-mvp/public_showroom_topology_radar_v1.html"
      - "docs/final/schemas/showroom_meaning_topology_graph_slice_v1.schema.json"
      - "tests/test_build_showroom_meaning_topology_graph_slice_v1.py"
      - "projects/bitcoin-trading/ops/windows-rehearsal/jemaai-cloud-mvp/public_showroom_meaning_topology_graph_v1.html"
      - ".github/workflows/showroom-bundle-validate.yml"
  pull_request:
    paths:
      - "scripts/validate_showroom_public_bundle.py"
      - "scripts/build_showroom_topology_radar_snapshot_v1.py"
      - "scripts/build_showroom_track_c_bundle_chain_v1.ps1"
      - "projects/bitcoin-trading/ops/windows-rehearsal/build_showroom_display_bundle.ps1"
      - "scripts/Invoke-ShowroomTrackCPublishRoutine_v1.ps1"
      - "scripts/Invoke-ShowroomTrackCHealth_v1.ps1"
      - "scripts/Verify-ShowroomTrackCPublishScheduledTask_v1.ps1"
      - "scripts/Verify-ShowroomTrackCNginxWeeklyScheduledTask_v1.ps1"
      - "scripts/Register-ShowroomTrackCPublishDailyTask.ps1"
      - "scripts/Register-ShowroomTrackCNginxWeeklyTask.ps1"
      - "scripts/check_showroom_trust_viz_public_chain_v1.py"
      - "projects/bitcoin-trading/ops/windows-rehearsal/deploy_showroom_static.ps1"
      - "projects/bitcoin-trading/ops/windows-rehearsal/sync_showroom_to_vps.ps1"
      - "projects/bitcoin-trading/ops/windows-rehearsal/jemaai-cloud-mvp/public_showroom_poll.html"
      - "projects/bitcoin-trading/ops/windows-rehearsal/jemaai-cloud-mvp/public_showroom_board_minimal.html"
      - "docs/final/schemas/showroom_topology_radar_snapshot_v1.schema.json"
      - "docs/final/schemas/showroom_topology_radar_snapshot_v1.example.json"
      - "tests/test_validate_showroom_public_bundle.py"
      - "tests/test_showroom_topology_radar_snapshot_schema_v1.py"
      - "tests/test_build_showroom_topology_radar_snapshot_v1.py"
      - "scripts/build_showroom_meaning_topology_graph_slice_v1.py"
      - "scripts/build_showroom_macro_horizon_2030_slice_v1.py"
      - "docs/final/schemas/showroom_macro_horizon_2030_slice_v1.schema.json"
      - "tests/test_build_showroom_macro_horizon_2030_slice_v1.py"
      - "projects/bitcoin-trading/ops/windows-rehearsal/jemaai-cloud-mvp/public_showroom_topology_radar_v1.html"
      - "docs/final/schemas/showroom_meaning_topology_graph_slice_v1.schema.json"
      - "tests/test_build_showroom_meaning_topology_graph_slice_v1.py"
      - "projects/bitcoin-trading/ops/windows-rehearsal/jemaai-cloud-mvp/public_showroom_meaning_topology_graph_v1.html"
      - ".github/workflows/showroom-bundle-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Run showroom validator + topology radar snapshot tests
        run: |
          python -m pytest \
            tests/test_validate_showroom_public_bundle.py \
            tests/test_showroom_topology_radar_snapshot_schema_v1.py \
            tests/test_build_showroom_topology_radar_snapshot_v1.py \
            tests/test_build_showroom_meaning_topology_graph_slice_v1.py \
            tests/test_build_showroom_macro_horizon_2030_slice_v1.py \
            -q --tb=short

