# Gemini 배치 CLI 회귀 — API 키 불필요 (check + pytest만).
name: Gemini Multimodal Batch CLI

on:
  push:
    branches: [main, master, develop]
    paths:
      - "scripts/gemini_multimodal_batch.py"
      - "scripts/Invoke-GeminiMultimodalBatch.ps1"
      - "tests/test_gemini_multimodal_batch_cli.py"
      - ".github/workflows/gemini-multimodal-batch-cli.yml"
  pull_request:
    paths:
      - "scripts/gemini_multimodal_batch.py"
      - "scripts/Invoke-GeminiMultimodalBatch.ps1"
      - "tests/test_gemini_multimodal_batch_cli.py"
      - ".github/workflows/gemini-multimodal-batch-cli.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade google-genai pytest

      - name: Script check (no API key)
        run: python scripts/gemini_multimodal_batch.py check

      - name: Pytest CLI tests
        run: python -m pytest tests/test_gemini_multimodal_batch_cli.py -q
