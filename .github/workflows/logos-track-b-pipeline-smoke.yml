      - "docs/final/artifacts/LOGOS_VECTOR_INDEX_MANIFEST_V1_CONTRACT.json"
      - ".github/workflows/logos-track-b-pipeline-smoke.yml"

permissions:
  contents: read

concurrency:
  group: logos-track-b-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest jsonschema ijson
      - name: pytest Logos Track B pipeline bundle
        run: >
          python -m pytest
          tests/test_logos_corpus_manifest_v1.py
          tests/test_logos_corpus_graph_bundle_v1.py
          tests/test_logos_vector_index_stub_v1.py
          tests/test_logos_mkm_theology_baseline_v1.py
          tests/test_track_b_theology_fusion_integration_v1.py
          tests/test_logos_deep_research_distill_schema_v1.py
          tests/test_logos_track_b_policy_readiness_v1.py
          tests/test_logos_vector_index_manifest_v1.py
          tests/test_logos_vector_index_ann_lite_v1.py
          tests/test_logos_track_b_deep_fusion_job_v1.py
          tests/test_run_logos_track_b_pipeline_chain_v1.py
          tests/test_logos_track_c_freshness_sidecar_v1.py
          tests/test_promote_logos_to_shadow_live_v1.py
          tests/test_build_logos_shadow_alert_decision_v1.py
          tests/test_build_logos_s1_shadow_promotion_review_packet_v1.py
          tests/test_record_logos_s1_shadow_promotion_human_approval_v1.py
          tests/test_validate_three_lens_kpi_contract_v1.py
          tests/test_logos_semantic_query_set_weekly_v1.py
          -q --tb=short
