# Blocks internal codenames / competitor-brand phrasing on the static marketing site.
name: no1kmedi-marketing-copy
# Required-check trigger guard: keep path-filter workflow visible to PR checks.

on:
  push:
    paths:
      - "projects/no1kmedi/marketing-site/**"
      - "projects/no1kmedi/src/**"
      - "scripts/verify_12ai_orchestration_gate.ps1"
      - ".github/workflows/no1kmedi-marketing-copy.yml"
  pull_request:
    paths:
      - "projects/no1kmedi/marketing-site/**"
      - "projects/no1kmedi/src/**"
      - "scripts/verify_12ai_orchestration_gate.ps1"
      - ".github/workflows/no1kmedi-marketing-copy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  orchestration-gate:
    if: ${{ vars.ENABLE_GH_ACTIONS_RUNNERS == 'true' }}
    uses: ./.github/workflows/12ai-orchestration-gate.yml
    with:
      role: Architect
      current_metrics_path: docs/final/artifacts/bench_l1_api_load_latest.json
      baseline_metrics_path: docs/final/artifacts/bench_l1_api_load_summary_vps_latest.json
      retries: 3
      action: change_strategy

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Banned public phrases
        shell: pwsh
        run: ./projects/no1kmedi/marketing-site/check-public-copy.ps1
      - name: Public copy schema + compliance check
        shell: pwsh
        run: npm --prefix ./projects/no1kmedi run check:marketing-copy

# sync: required-check trigger
