name: Backend Fact Engine Quantization Guard

# Private repo + free tier: keep least privilege and cancel superseded runs to save minutes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "projects/bitcoin-trading/src/**"
      - "scripts/**"
      - ".github/workflows/backend-fact-engine-quantization-guard.yml"
      - "scripts/enforce_backend_fact_engine_quantization_guard.py"
  workflow_dispatch:

jobs:
  quantization-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Enforce backend fact-engine quantization guard
        run: |
          set -euo pipefail
          python3 scripts/enforce_backend_fact_engine_quantization_guard.py \
            --scan-dir projects/bitcoin-trading/src \
            --scan-dir scripts \
            --skip-regex "/scripts/run_rag_turboquant_poc_template.py" \
            --skip-regex "/scripts/train_mkm_prophecy_lora_unsloth.py"

