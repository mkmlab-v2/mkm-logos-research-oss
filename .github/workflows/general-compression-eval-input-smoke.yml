# General rail: eval input builder must succeed (manifest JSONL and/or V2 fallback).
name: General compression eval input smoke

on:
  push:
    branches: [main, master, develop]
    paths:
      - "scripts/build_general_compression_eval_input.py"
      - "docs/final/artifacts/general_compression_benchmark_manifest_v1.json"
      - "docs/final/artifacts/MULTILENS_PERFORMANCE_EVAL_INPUT_V2.json"
      - "tests/test_build_general_compression_eval_input_smoke_v1.py"
      - ".github/workflows/general-compression-eval-input-smoke.yml"
  pull_request:
    paths:
      - "scripts/build_general_compression_eval_input.py"
      - "docs/final/artifacts/general_compression_benchmark_manifest_v1.json"
      - "docs/final/artifacts/MULTILENS_PERFORMANCE_EVAL_INPUT_V2.json"
      - "tests/test_build_general_compression_eval_input_smoke_v1.py"
      - ".github/workflows/general-compression-eval-input-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build eval input + pytest smoke
        run: |
          python scripts/build_general_compression_eval_input.py
          python -m pytest tests/test_build_general_compression_eval_input_smoke_v1.py -q
