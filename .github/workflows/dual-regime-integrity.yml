  workflow_dispatch:
    inputs:
      symbol_gate_threshold:
        description: "Two-phase symbol gate threshold (resonance_rate_random)"
        required: false
        default: "0.85"
        type: string
      fusion_max_cee_risk_band:
        description: "Fusion gate max allowed CEE risk band"
        required: false
        default: "critical_thin"
        type: choice
        options:
          - stable
          - medium
          - high_thin
          - critical_thin
      fusion_enforce_thin_streak:
        description: "Enforce thin-margin streak as hard fail"
        required: false
        default: false
        type: boolean
      token_api_live_ratio_blocking:
        description: "Enable blocking gate for token API live_ratio"
        required: false
        default: false
        type: boolean
      approve_numeric_near_miss:
        description: "Enable numeric near-miss promotion export (manual approval only)"
        required: false
        default: false
        type: boolean

jobs:
  dual-regime-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pytest and jsonschema
        run: python -m pip install --upgrade pip pytest jsonschema fastapi httpx pyyaml tiktoken scipy zstandard

      - name: Integrity guard (golden lock k=6866, 1574 intersection, 149 probes)
        run: python scripts/integrity_guard.py

      - name: Log metabolism JSONL slice + multilens V3 eval input builder smoke
        run: |
          set -euo pipefail
          python scripts/slice_log_metabolism_jsonl_v1.py \
            --in docs/final/artifacts/fixtures/log_metabolism_smoke_v1.jsonl \
            --out /tmp/metabolism_slice_ci.jsonl \
            --tail 2
          test "$(wc -l < /tmp/metabolism_slice_ci.jsonl)" -eq 2
          python scripts/tools/build_multilens_eval_input_v3_subset_v1.py \
            --first-n 5 \
            --out /tmp/multilens_eval_input_v3_ci.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/multilens_eval_input_v3_ci.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d.get("schema") == "multilens_performance_eval_input_v3", d.get("schema")
