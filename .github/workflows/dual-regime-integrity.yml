      - "scripts/build_btrack_prophecy_score_from_ohlcv.py"
      - "scripts/build_btrack_llm_input_bundle.py"
      - "scripts/run_btrack_daily_hypothesis_chain.ps1"
      - "scripts/append_btrack_insight_observation.py"
      - "docs/final/BTRACK_HYPOTHESIS_PROPHECY_V1.schema.json"
      - "docs/final/artifacts/btrack_llm_input_bundle_latest.json"
      - "docs/final/artifacts/btrack_hypothesis_prophecy_latest.json"
      - "docs/final/MKM12_PRISM_INDEX_REGISTRY_V1.json"
      - "docs/final/B_TRACK_HYPOTHESIS_INVENTORY_SCHEMA.json"
      - "docs/final/artifacts/B_TRACK_HYPOTHESIS_INVENTORY_V1.json"
