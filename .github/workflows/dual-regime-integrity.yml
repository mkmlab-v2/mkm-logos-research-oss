name: Dual Regime Integrity (Fact-Lock)

on:
  push:
    # No paths filter: every push to these branches runs Fact-Lock so main tip cannot
    # advance (e.g. docs/battleboard only) without a matching workflow run.
    # Include chore/** so feature/WIP branches (e.g. chore/wip-isolated-*) run CI without opening a PR.
    branches: [main, master, develop, ci/autopsy-verify, "chore/**"]
  pull_request:
    paths:
      - "projects/bitcoin-trading/**"
      - "data/regimes/**"
      - "projects/bitcoin-trading/tests/**"
      - "pytest.ini"
      - ".gitattributes"
      - ".github/workflows/dual-regime-integrity.yml"
      - "scripts/integrity_guard.py"
      - "scripts/sync_btrack_phase3_snapshot_json_fence.py"
      - "scripts/run_fact_lock_bundle.ps1"
      - "scripts/run_p1_ab_bundle.ps1"
      - "scripts/run_p1_efficiency_ab.py"
      - "scripts/report_p1_final_selection.py"
      - "scripts/verify_master_probe_all_states.py"
      - "tests/snapshots/**"
      - "backtest_results/sweep_kmin_refine/**"
      - "data/myeongni/**"
      - "docs/final/openapi_token_compression_stub_v1.yaml"
      - "docs/final/openapi_token_compression_v2_draft.yaml"
      - "scripts/compression_token_api_stub.py"
      - "scripts/compression_token_api_v2_stub.py"
      - "docs/final/artifacts/LOGOS_STATE_MAPPING_V1.json"
      - "docs/final/artifacts/CROSS_REF_DSS_TO_STATES_DRAFT.json"
      - "docs/final/artifacts/SASANG_CROSS_REF_DRAFT.json"
      - "docs/final/artifacts/MULTILENS_P1_AB_EFFICIENCY_V1.json"
      - "docs/final/artifacts/MULTILENS_P1_AB_INTENSITY_V1.json"
      - "docs/final/artifacts/MULTILENS_P1_AB_BALANCED_V1.json"
      - "docs/final/artifacts/MULTILENS_P1_AB_FINAL_SELECTION_V1.json"
      - "docs/final/CROSS_REF_DRAFT_V2_DOCUMENT.schema.json"
      - "scripts/join_logos_verses_myeongni_states_4d.py"
      - "scripts/add_entry16_source_and_rejudge.py"
      - "scripts/report_myeongni_16_state_transition.py"
      - "scripts/report_myeongni_16_state_topflows.py"
      - "scripts/report_myeongni_16_state_topflow_interpretation.py"
      - "scripts/report_myeongni_topflow_integrated_snapshot.py"
      - "scripts/report_multilens_performance_eval.py"
      - "scripts/run_ultra_compression_bench.py"
      - "scripts/run_ultra_compression_default.py"
      - "scripts/report_compression_jaccard_loss_patterns.py"
      - "scripts/report_ultra_compression_kpi_summary.py"
      - "scripts/run_workspace_automation_health.ps1"
      - "scripts/run_compression_automation_chain.ps1"
      - "scripts/run_compression_weekly_governance_chain.ps1"
      - "scripts/Register-CompressionWeeklyGovernanceTask.ps1"
      - "scripts/build_compression_weekly_governance_report.py"
      - "scripts/check_btrack_regression.py"
      - "scripts/lock_btrack_verified_baseline.py"
      - "scripts/build_btrack_dss_enriched_from_docs.py"
      - "scripts/build_btrack_symbol_promotion_lanes.py"
      - "scripts/evaluate_btrack_symbol_lane_gate.py"
      - "scripts/run_btrack_symbol_lane_gate.py"
      - "scripts/run_btrack_symbol_lane_gate_and_lock.py"
      - "scripts/lock_btrack_symbol_lane_baseline.py"
      - "scripts/check_btrack_symbol_lane_regression.py"
      - "scripts/report_btrack_symbol_source_split.py"
      - "scripts/extract_btrack_symbol_candidates.py"
      - "scripts/curate_btrack_symbol_candidates.py"
      - "scripts/join_symbol_vector_4d.py"
      - "scripts/report_symbol_gematria_alignment.py"
      - "scripts/report_gematria_4d_uplift_ab.py"
      - "scripts/check_gematria_4d_gate.py"
      - "scripts/run_gematria_4d_gate.py"
      - "scripts/run_deut32_cee_pilot.py"
      - "scripts/run_deut32_cee_stability_sweep.py"
      - "scripts/run_btrack_fusion_gate.py"
      - "scripts/build_symbol_vectors_from_verse_distilled.py"
      - "scripts/report_symbol_gematria_alignment.py"
      - "scripts/report_symbol_allowlist_ab_bench.py"
