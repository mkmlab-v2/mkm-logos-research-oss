jobs:
  dual-regime-integrity:
    if: ${{ vars.ENABLE_GH_ACTIONS_RUNNERS == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: P0 CONSTITUTION path gate (required file inventory)
        shell: pwsh
        run: ./scripts/verify_p0_constitution_gate_paths.ps1 -WorkspaceRoot $env:GITHUB_WORKSPACE

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: MKM promotion gate evidence bundle (G0-G11 audit JSON)
        run: python scripts/build_mkm_promotion_gate_evidence_bundle_v1.py --workspace-root "${GITHUB_WORKSPACE}"

      - name: Install pytest and jsonschema
        run: python -m pip install --upgrade pip pytest jsonschema fastapi httpx pyyaml tiktoken scipy zstandard pyloudnorm

      - name: Integrity guard (golden lock k=6866, 1574 intersection; master_probe checks per integrity_lock.json)
        run: python scripts/integrity_guard.py

      - name: Log metabolism JSONL slice + multilens V3 eval input builder smoke
        run: |
          set -euo pipefail
          python scripts/slice_log_metabolism_jsonl_v1.py \
            --in docs/final/artifacts/fixtures/log_metabolism_smoke_v1.jsonl \
            --out /tmp/metabolism_slice_ci.jsonl \
            --tail 2
          test "$(wc -l < /tmp/metabolism_slice_ci.jsonl)" -eq 2
          python scripts/tools/build_multilens_eval_input_v3_subset_v1.py \
            --first-n 5 \
            --out /tmp/multilens_eval_input_v3_ci.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/multilens_eval_input_v3_ci.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d.get("schema") == "multilens_performance_eval_input_v3", d.get("schema")
          assert len(d.get("compression_cases") or []) == 5, len(d.get("compression_cases") or [])
          PY

      - name: Multilens log shard routing pilot JSON (contract)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/final/artifacts/MULTILENS_EVAL_LOG_SHARD_ROUTING_PILOT_V1.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d.get("schema") == "multilens_performance_eval_input_v1"
          cases = d.get("compression_cases") or []
          assert len(cases) == 6, len(cases)
          for i, c in enumerate(cases, start=1):
              assert c.get("id"), i
              for k in ("raw_text", "compressed_text", "reconstructed_text"):
                  assert isinstance(c.get(k), str) and c[k].strip(), (i, k)
          PY

      - name: Run Dual Regime API smoke / Fact-Lock tests
        run: bash projects/bitcoin-trading/ops/v2/tasks/run_prophecy_alignment_pytest.sh

      - name: TruthfulQA A/B repro bundle (DryRun) and pytest
        run: |
          set -euo pipefail
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/Run-TruthfulQAReproBundleV1.ps1 -DryRun
          python -m pytest \
            tests/test_run_truthfulqa_ab_benchmark_v1.py \
            tests/test_check_truthfulqa_ab_gate_v1.py \
            tests/test_run_truthfulqa_repro_bundle_v1.py \
            tests/test_run_fact_lock_bundle_truthfulqa_gate.py \
            -q --tb=short

      - name: Track source guard (A/B JSONL tagging)
        run: python -m pytest tests/test_track_source_guard.py -q --tb=short

      - name: Sovereign JSONL iterator + sovereign token spike smoke
        run: |
          python -m pytest tests/test_sovereign_jsonl.py tests/test_spike_sovereign_token_saving_v1.py tests/test_sovereign_efficiency.py -q --tb=short

      # Some spike tests are branch-optional (not always tracked on main/chore branches).
      # Guard missing files to avoid false-red CI from "file not found" while keeping
      # tracked tests strict when they exist.
      - name: AE-2 KOSPI structural entropy spike smoke
        run: |
          python -m pip install --upgrade zstandard
          if [[ -f tests/test_spike_kospi_structural_entropy_v1.py && -f tests/test_spike_kospi_structural_entropy_compare_v1.py ]]; then
            python -m pytest tests/test_spike_kospi_structural_entropy_v1.py tests/test_spike_kospi_structural_entropy_compare_v1.py -q --tb=short
          else
            echo "SKIP: AE-2 KOSPI structural entropy tests are not tracked in this branch."
          fi

      - name: Logos–Myeongni state mapping snapshot (tracked artifact, no verse pipeline on runner)
        run: python -m pytest tests/test_logos_state_mapping_v1_snapshot.py -q --tb=short

      - name: ENTRY_16 source-ingest helper contract
        run: python -m pytest tests/test_add_entry16_source_and_rejudge.py -q --tb=short

      - name: CROSS_REF draft vs LOGOS_STATE_MAPPING (canonical_ref join Fact-Lock)
        run: python -m pytest tests/test_cross_ref_dss_schema.py -q --tb=short

      - name: B-track Hypothesis Inventory schema
        run: python -m pytest tests/test_b_track_hypothesis_inventory.py -q --tb=short

      - name: B-Track hypothesis + dawn-score + prophecy hit-rate eval smoke
        run: python -m pytest tests/test_generate_btrack_hypothesis_prophecy_v1.py tests/test_build_btrack_prophecy_score_from_ohlcv.py tests/test_eval_prophecy_hit_rate_v1.py tests/test_run_btrack_prophecy_contemplation_v1.py tests/test_btrack_daily_hypothesis_chain_contemplation_contract_v1.py -q --tb=short

      - name: Prophecy evolution watchdog (staleness + tail streak/EMA contract)
        run: python -m pytest tests/test_check_prophecy_evolution_watchdog_v1.py -q --tb=short

      - name: B-track news_observation JSONL schema + validator CLI smoke
        run: |
          python -m pytest \
            tests/test_news_observation_v1_schema.py \
            tests/test_validate_news_observation_jsonl_v1.py \
            tests/test_check_news_label_join_temporal_v1.py \
            tests/test_build_news_observation_jsonl_from_csv_v1.py \
            tests/test_build_direction_label_bar_jsonl_from_ohlcv_v1.py \
            tests/test_join_news_observation_direction_labels_walkforward_v1.py \
            tests/test_build_direction_label_bar_kospi_csv_smoke_v1.py \
            -q --tb=short

      - name: Logos revalidation fusion + semantic separation regression
        run: |
          python -m pytest \
            tests/test_role_router_shadow_forward_fusion_regression.py \
            tests/test_promotion_directional_semantic_separation_v1.py \
            -q --tb=short

      - name: Survivor resonance direct-mapping + falsification chain regression
        run: |
          python -m pytest \
            tests/test_build_survivor_w3_direct_mapping_v1.py \
            tests/test_build_global_atom_survivor_resonance_daily_real_v1.py \
            tests/test_check_survivor_crash_falsification_gate_v1.py \
            tests/test_run_survivor_resonance_falsification_chain_v1.py \
            tests/test_sweep_survivor_crash_falsification_thresholds_v1.py \
            tests/test_tune_survivor_real_resonance_weights_v1.py \
            -q --tb=short
      - name: Survivor resonance operational bundle regression
        run: python -m pytest tests/test_run_survivor_resonance_operational_bundle_v1.py -q --tb=short
      - name: pytest human regime audit spike (Gemini retry + proxy + agreement)
        run: |
          if [[ -f tests/test_fill_human_regime_audit_llm_heuristic_spike.py && -f tests/test_fill_human_regime_audit_gemini_retry_spike.py && -f tests/test_fill_human_regime_audit_proxy_spike.py && -f tests/test_human_regime_audit_and_agreement_spike.py ]]; then
            python -m pytest tests/test_fill_human_regime_audit_llm_heuristic_spike.py tests/test_fill_human_regime_audit_gemini_retry_spike.py tests/test_fill_human_regime_audit_proxy_spike.py tests/test_human_regime_audit_and_agreement_spike.py -q --tb=short
          else
            echo "SKIP: human regime audit spike tests are not tracked in this branch."
          fi

      - name: ENTRY_16 source-hunt log contract
        run: python -m pytest tests/test_entry16_source_hunt_log.py -q --tb=short

      - name: ENTRY_16 source-hunt summary contract
        run: python -m pytest tests/test_entry16_source_hunt_summary.py -q --tb=short

      - name: ENTRY_16 promotion gate contract
        run: python -m pytest tests/test_entry16_promotion_gate.py -q --tb=short

      - name: Waiting-queue monthly check log contract
        run: python -m pytest tests/test_waiting_queue_monthly_check_log.py -q --tb=short

      - name: General prophecy B-rail (schema, chain smoke, resolver, LoRA JSONL export, weather GT triplet)
        run: |
          python -m pytest \
            tests/test_general_prophecy_schema_v1.py \
            tests/test_general_prophecy_chain_smoke.py \
            tests/test_resolve_general_prophecy_question_v1.py \
            tests/test_export_general_prophecy_to_jsonl.py \
            tests/test_weather_gt_triplet_chain_smoke.py \
            -q --tb=short

      - name: B-track session Myeongni panel + weather/OHLCV join + correlate chain
        run: |
          python -m pytest \
            tests/test_build_btrack_session_instant_myeongni_panel_v1.py \
            tests/test_join_btrack_session_panel_weather_ohlcv_v1.py \
            tests/test_correlate_btrack_joined_wide_csv_v1.py \
            tests/test_run_btrack_session_panel_weather_corr_chain_v1.py \
            -q --tb=short

      - name: Weather synthetic 120d E2E (full chain + Brier, temp outputs)
        run: |
          set -euo pipefail
          if [ ! -f "scripts/run_weather_synthetic_120d_chain_and_brier_v1.py" ]; then
            echo "SKIP: scripts/run_weather_synthetic_120d_chain_and_brier_v1.py not present on this branch."
            exit 0
          fi
          WDIR="${RUNNER_TEMP}/weather_synth120d_e2e"
          mkdir -p "$WDIR"
          export WDIR
          python scripts/run_weather_synthetic_120d_chain_and_brier_v1.py \
            --registry-json "$WDIR/triplet.json" \
            --jsonl "$WDIR/gt.jsonl" \
            --brier-out "$WDIR/brier_sidecar.json" \
            --ece-bins 10 --ece-min-per-tag 5
          python scripts/run_weather_synthetic_120d_chain_and_brier_v1.py \
            --stub-only \
            --registry-json "$WDIR/triplet_stub.json" \
            --jsonl "$WDIR/gt_stub.jsonl" \
            --brier-out "$WDIR/brier_stub.json" \
            --ece-bins 10 --ece-min-per-tag 5
          python -c "import json,os; w=os.environ['WDIR']; sc=json.load(open(os.path.join(w,'brier_sidecar.json')))['metrics']['mean_brier_score']; st=json.load(open(os.path.join(w,'brier_stub.json')))['metrics']['mean_brier_score']; assert abs(st-0.25)<1e-9, st; assert sc < 0.05, sc"

      - name: FACT-LOCK lexicon manifest fixture + seed summary shape (when present)
        run: python -m pytest tests/test_fact_lock_lexicon_gate.py -q --tb=short

      - name: Lexicon rails (corpus split, morphhb WLC index, TBESH audit, coverage v2)
        run: |
          python -m pytest \
            tests/test_master_atoms_corpus_split.py \
            tests/test_morphhb_wlc_index.py \
            tests/test_step_tbesh_audit.py \
            tests/test_lexicon_coverage_v2_report.py \
            tests/test_morphhb_match_by_corpus_report.py \
            tests/test_canon_unmatched_morphhb_top100_audit.py \
            tests/test_resolve_morphhb_multi_deterministic.py \
            tests/test_export_master_codebook_v1.py \
            -q --tb=short

      - name: L1 codebook bypass literal roundtrip
        run: python -m pytest tests/test_l1_codebook_bypass_roundtrip.py -q --tb=short

      - name: L1 inverse decoder summary + side-channel wire codec (promotion pre-flight)
        run: |
          python -m pytest \
            tests/test_l1_inverse_decoder_summary_schema.py \
            tests/test_l1_side_channel_wire_codec.py \
            -q --tb=short

      - name: Token API stub contract (core)
        run: python -m pytest tests/test_compression_token_api_stub.py -q --tb=short -k "not openapi_"

      - name: Token API OpenAPI parity (golden examples)
        run: python -m pytest tests/test_compression_token_api_stub.py -q --tb=short -k "openapi_compress_examples_parity or openapi_expand_examples_parity"

      - name: Trust Packet API v2 stub (round-trip + Jaccard floor — no v1 echo)
        run: python -m pytest tests/test_compression_token_api_v2_stub.py -q --tb=short

      - name: jemaai.cloud V1 vs V2 Explorer static page (path lock)
        run: test -f projects/bitcoin-trading/ops/windows-rehearsal/jemaai-cloud-mvp/compression_v2_explorer.html

      - name: Token API hydration mix snapshot
        run: python scripts/report_token_api_hydration_mix.py

      - name: Token API hydration trend snapshot
        run: python scripts/report_token_api_hydration_trend.py

      - name: Ultra compression active reports (universal + literal + ultra-literal)
        run: |
          python scripts/run_ultra_compression_default.py
          python scripts/run_ultra_compression_default.py --mode literal
          python scripts/run_ultra_compression_default.py --mode ultra-literal

      - name: Ultra compression KPI summary snapshot
        run: python scripts/report_ultra_compression_kpi_summary.py

      - name: Ultra compression KPI summary contract
        run: python -m pytest tests/test_ultra_compression_kpi_summary.py tests/test_compression_alarm_thresholds_v1.py -q --tb=short

      - name: Compression weekly governance report snapshot
        run: python scripts/build_compression_weekly_governance_report.py

      - name: Compression weekly governance report contract
