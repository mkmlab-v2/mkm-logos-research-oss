      - "tests/test_ultra_compression_artifacts.py"
      - "tests/test_compression_weekly_governance_report.py"
      - "tests/test_run_deut32_cee_pilot.py"
      - "tests/test_run_deut32_cee_stability_sweep.py"
      - "tests/test_run_btrack_fusion_gate.py"
      - "tests/test_cross_ref_dss_schema.py"
      - "tests/test_b_track_hypothesis_inventory.py"
      - "tests/test_generate_btrack_hypothesis_prophecy_v1.py"
      - "tests/test_eval_prophecy_hit_rate_v1.py"
      - "tests/test_build_btrack_prophecy_score_from_ohlcv.py"
      - "scripts/generate_btrack_hypothesis_prophecy_v1.py"
