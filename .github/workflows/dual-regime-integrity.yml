    inputs:
      symbol_gate_threshold:
        description: "Two-phase symbol gate threshold (resonance_rate_random)"
        required: false
        default: "0.85"
        type: string
      fusion_max_cee_risk_band:
        description: "Fusion gate max allowed CEE risk band"
        required: false
        default: "critical_thin"
        type: choice
        options:
          - stable
          - medium
          - high_thin
          - critical_thin
      fusion_enforce_thin_streak:
        description: "Enforce thin-margin streak as hard fail"
        required: false
        default: false
        type: boolean
      token_api_live_ratio_blocking:
        description: "Enable blocking gate for token API live_ratio"
        required: false
        default: false
        type: boolean
      approve_numeric_near_miss:
        description: "Enable numeric near-miss promotion export (manual approval only)"
        required: false
