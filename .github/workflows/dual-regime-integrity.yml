name: Dual Regime Integrity (Fact-Lock)

on:
  push:
    # No paths filter: every push to these branches runs Fact-Lock so main tip cannot
    # advance (e.g. docs/battleboard only) without a matching workflow run.
    # Include chore/** so feature/WIP branches (e.g. chore/wip-isolated-*) run CI without opening a PR.
    branches: [main, master, develop, ci/autopsy-verify, "chore/**"]
  pull_request:
    paths:
      - "projects/bitcoin-trading/**"
      - "data/regimes/**"
      - "projects/bitcoin-trading/tests/**"
      - "pytest.ini"
      - ".gitattributes"
      - ".github/workflows/dual-regime-integrity.yml"
      - "scripts/integrity_guard.py"
      - "scripts/sync_btrack_phase3_snapshot_json_fence.py"
      - "scripts/run_fact_lock_bundle.ps1"
      - "scripts/verify_master_probe_all_states.py"
      - "tests/snapshots/**"
      - "backtest_results/sweep_kmin_refine/**"
      - "data/myeongni/**"
      - "docs/final/artifacts/LOGOS_STATE_MAPPING_V1.json"
      - "docs/final/artifacts/CROSS_REF_DSS_TO_STATES_DRAFT.json"
      - "docs/final/artifacts/SASANG_CROSS_REF_DRAFT.json"
      - "docs/final/CROSS_REF_DRAFT_V2_DOCUMENT.schema.json"
      - "scripts/join_logos_verses_myeongni_states_4d.py"
      - "scripts/add_entry16_source_and_rejudge.py"
      - "scripts/report_myeongni_16_state_transition.py"
      - "tests/test_logos_state_mapping_v1_snapshot.py"
      - "tests/test_add_entry16_source_and_rejudge.py"
      - "tests/test_myeongni_16_state_transition_report.py"
      - "tests/test_cross_ref_dss_schema.py"
      - "tests/test_entry16_source_hunt_log.py"
      - "tests/test_entry16_source_hunt_summary.py"
      - "tests/test_entry16_promotion_gate.py"
      - "tests/test_waiting_queue_monthly_check_log.py"
      - "tests/test_btrack_phase3_snapshot_sync.py"
      - "tests/test_sasang_cross_ref_draft.py"
      - "tests/test_myeongni_insight_observation_log.py"
      - "docs/final/MYEONGNI_FUSION_INTERFACE_STUB.json"
      - "docs/final/MYEONGRI_INSIGHT_SSOT.md"
      # Docs-only PRs (battleboard, manifests) also trigger Fact-Lock
      - "docs/**"
  workflow_dispatch:

jobs:
  dual-regime-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest and jsonschema
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Integrity guard (golden lock k=6866, 1574 intersection, 149 probes)
        run: python scripts/integrity_guard.py

      - name: Run Dual Regime API smoke / Fact-Lock tests
        run: bash projects/bitcoin-trading/ops/v2/tasks/run_prophecy_alignment_pytest.sh

      - name: Logos–Myeongni state mapping snapshot (tracked artifact, no verse pipeline on runner)
        run: python -m pytest tests/test_logos_state_mapping_v1_snapshot.py -q --tb=short

      - name: ENTRY_16 source-ingest helper contract
        run: python -m pytest tests/test_add_entry16_source_and_rejudge.py -q --tb=short

      - name: CROSS_REF draft vs LOGOS_STATE_MAPPING (canonical_ref join Fact-Lock)
        run: python -m pytest tests/test_cross_ref_dss_schema.py -q --tb=short

      - name: ENTRY_16 source-hunt log contract
        run: python -m pytest tests/test_entry16_source_hunt_log.py -q --tb=short

      - name: ENTRY_16 source-hunt summary contract
        run: python -m pytest tests/test_entry16_source_hunt_summary.py -q --tb=short

      - name: ENTRY_16 promotion gate contract
        run: python -m pytest tests/test_entry16_promotion_gate.py -q --tb=short

      - name: Waiting-queue monthly check log contract
        run: python -m pytest tests/test_waiting_queue_monthly_check_log.py -q --tb=short

      - name: B-Track Phase3 snapshot fence matches CROSS_REF SSOT
        run: python -m pytest tests/test_btrack_phase3_snapshot_sync.py -q --tb=short

      - name: SASANG CROSS_REF draft (ijeoma chunk ↔ LOGOS bench Fact-Lock)
        run: python -m pytest tests/test_sasang_cross_ref_draft.py -q --tb=short

      - name: Myeongni insight observation JSONL + fusion interface stub (§3.3)
        run: python -m pytest tests/test_myeongni_insight_observation_log.py -q --tb=short

      - name: Myeongni 16-state transition report contract
        run: python -m pytest tests/test_myeongni_16_state_transition_report.py -q --tb=short

      - name: Upload REGIME_INTEGRITY_REPORT.json (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regime-integrity-report
          path: backtest_results/REGIME_INTEGRITY_REPORT.json
          if-no-files-found: ignore

      # Passive: on failure, preserve full backtest_results for autopsy (logs, dumps, JSON).
      - name: Upload backtest_results (failure autopsy)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-autopsy
          path: backtest_results/
          if-no-files-found: ignore
