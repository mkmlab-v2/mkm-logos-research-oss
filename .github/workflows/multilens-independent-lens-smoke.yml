# Smoke: independent lens runners (myeongni / sasang / logos) + shadow gate + fusion stub
# + daily execution insight brief materializer + boming lexicon + B-track sidecar lens agreement eval (no GPU).
name: Multilens independent lens smoke

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop, "chore/**"]
    paths:
      - "scripts/run_lens_myeongni.py"
      - "scripts/myeongni_lens_v1/**"
      - "scripts/emit_myeongni_lens_advanced_from_fusion_v1.py"
      - "scripts/run_myeongni_lens_chain_from_bot_v1.py"
      - "scripts/run_manseryeok_bot_v1.py"
      - "scripts/Run-MyeongniLensChainFromBot_v1.ps1"
      - "scripts/run_lens_sasang.py"
      - "scripts/run_lens_logos.py"
      - "scripts/report_independent_lens_shadow_gate.py"
      - "scripts/report_independent_lens_fusion_stub_v0.py"
      - "scripts/build_daily_execution_insight_brief_v1.py"
      - "scripts/emit_myeongni_thin_bridge_line_v1.py"
      - "scripts/eval_btrack_insight_sidecar_lens_hit_agreement_v1.py"
      - "scripts/btrack_yang_2015_style_metrics_v1.py"
      - "scripts/run_myeongni_celebrity_benchmark_v1.py"
      - "scripts/run_saju_global_birth_v1.py"
      - "scripts/myeongri_core_v2_upgrade.py"
      - "tests/test_btrack_yang_2015_style_metrics_v1.py"
      - "tests/test_myeongni_paper_contract_map_v1.py"
      - "tests/test_run_myeongni_celebrity_benchmark_v1.py"
      - "tests/test_yang_2015_btrack_json_schema_v1.py"
      - "docs/final/schemas/btrack_yang_2015_style_metrics_v1.schema.json"
      - "docs/final/schemas/myeongni_celebrity_hit_rate_v1.schema.json"
      - "tests/test_independent_lenses_v0.py"
      - "tests/test_myeongni_independent_lens_v0.py"
      - "tests/test_myeongni_lens_v1_contract.py"
      - "tests/test_myeongni_fusion_bridge_v1.py"
      - "tests/test_myeongni_lens_chain_from_bot_v1.py"
      - "tests/fixtures/myeongni_advanced_input_minimal_v1.json"
      - "tests/test_independent_lens_shadow_gate_v1.py"
      - "tests/test_independent_lens_fusion_stub_v0.py"
      - "tests/test_build_daily_execution_insight_brief_v1.py"
      - "tests/test_emit_myeongni_thin_bridge_line_v1.py"
      - "tests/test_scm_boming_jiju_lexicon_v1.py"
      - "tests/test_eval_btrack_insight_sidecar_lens_hit_agreement_v1.py"
      - "data/myeongni/**"
      - "data/sasang/**"
      - "docs/final/artifacts/independent_lens_shadow_gate_latest.json"
      - "docs/final/artifacts/independent_lens_fusion_stub_latest.json"
      - ".github/workflows/multilens-independent-lens-smoke.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "scripts/run_lens_myeongni.py"
      - "scripts/myeongni_lens_v1/**"
      - "scripts/emit_myeongni_lens_advanced_from_fusion_v1.py"
      - "scripts/run_myeongni_lens_chain_from_bot_v1.py"
      - "scripts/run_manseryeok_bot_v1.py"
      - "scripts/Run-MyeongniLensChainFromBot_v1.ps1"
      - "scripts/run_lens_sasang.py"
      - "scripts/run_lens_logos.py"
      - "scripts/report_independent_lens_shadow_gate.py"
      - "scripts/report_independent_lens_fusion_stub_v0.py"
      - "scripts/build_daily_execution_insight_brief_v1.py"
      - "scripts/emit_myeongni_thin_bridge_line_v1.py"
      - "scripts/eval_btrack_insight_sidecar_lens_hit_agreement_v1.py"
      - "scripts/btrack_yang_2015_style_metrics_v1.py"
      - "scripts/run_myeongni_celebrity_benchmark_v1.py"
      - "scripts/run_saju_global_birth_v1.py"
      - "scripts/myeongri_core_v2_upgrade.py"
      - "tests/test_btrack_yang_2015_style_metrics_v1.py"
      - "tests/test_myeongni_paper_contract_map_v1.py"
      - "tests/test_run_myeongni_celebrity_benchmark_v1.py"
      - "tests/test_yang_2015_btrack_json_schema_v1.py"
      - "docs/final/schemas/btrack_yang_2015_style_metrics_v1.schema.json"
      - "docs/final/schemas/myeongni_celebrity_hit_rate_v1.schema.json"
      - "tests/test_independent_lenses_v0.py"
      - "tests/test_myeongni_independent_lens_v0.py"
      - "tests/test_myeongni_lens_v1_contract.py"
      - "tests/test_myeongni_fusion_bridge_v1.py"
      - "tests/test_myeongni_lens_chain_from_bot_v1.py"
      - "tests/fixtures/myeongni_advanced_input_minimal_v1.json"
      - "tests/test_independent_lens_shadow_gate_v1.py"
      - "tests/test_independent_lens_fusion_stub_v0.py"
      - "tests/test_build_daily_execution_insight_brief_v1.py"
      - "tests/test_emit_myeongni_thin_bridge_line_v1.py"
      - "tests/test_scm_boming_jiju_lexicon_v1.py"
      - "tests/test_eval_btrack_insight_sidecar_lens_hit_agreement_v1.py"
      - "data/myeongni/**"
      - "data/sasang/**"
      - "docs/final/artifacts/independent_lens_shadow_gate_latest.json"
      - "docs/final/artifacts/independent_lens_fusion_stub_latest.json"
      - ".github/workflows/multilens-independent-lens-smoke.yml"

permissions:
  contents: read

concurrency:
  group: multilens-independent-lens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest and jsonschema
        run: pip install pytest jsonschema
      - name: Multilens independent lens regression bundle
        run: >
          python -m pytest
          tests/test_independent_lenses_v0.py
          tests/test_myeongni_independent_lens_v0.py
          tests/test_myeongni_lens_v1_contract.py
          tests/test_myeongni_fusion_bridge_v1.py
          tests/test_myeongni_lens_chain_from_bot_v1.py
          tests/test_independent_lens_shadow_gate_v1.py
          tests/test_independent_lens_fusion_stub_v0.py
          tests/test_build_daily_execution_insight_brief_v1.py
          tests/test_emit_myeongni_thin_bridge_line_v1.py
          tests/test_scm_boming_jiju_lexicon_v1.py
          tests/test_eval_btrack_insight_sidecar_lens_hit_agreement_v1.py
          tests/test_btrack_yang_2015_style_metrics_v1.py
          tests/test_myeongni_paper_contract_map_v1.py
          tests/test_run_myeongni_celebrity_benchmark_v1.py
          tests/test_yang_2015_btrack_json_schema_v1.py
          -q --tb=short

