# Saju dual-verify: pytest on Ubuntu (no private submodule clone).
#
# The mkm-life Next route shells out to repo-root `scripts/saju_dual_verify.py`. CI here runs
# the Python gate + golden replay only. For `/api/v1/saju/verify` HTTP smoke, run locally
# (`npm run smoke:saju-verify` in `projects/mkm/mkm-life`) or add a workflow on the mkmlife-com
# repo; cloning that submodule in this org needs a PAT (GITHUB_TOKEN cannot read mkmlab-hq).
name: saju-dual-verify-gate

on:
  push:
    paths:
      - "scripts/saju_dual_verify.py"
      - "scripts/final_saju_verification.py"
      - "scripts/manseryeok_perfect_final.py"
      - "scripts/validate_ganji_mapping.py"
      - "scripts/validate_ephemeris_baseline.py"
      - "scripts/run_manseryeok_validation_smoke_v1.py"
      - "scripts/build_ganji_validation_cohort_v1.py"
      - "scripts/validate_collision_dictionary_v1.py"
      - "scripts/collision_dict_refresh_native_v1.py"
      - "scripts/sync_collision_dict_cohort_entries_v1.py"
      - "scripts/saju_birth_resolver_v1.py"
      - "scripts/run_saju_global_birth_v1.py"
      - "scripts/core/solar_term_ssot.py"
      - "scripts/core/solar_longitude_meeus_v1.py"
      - "scripts/core/boundary_risk_guard.py"
      - "scripts/run_saju_golden_replay.py"
      - "tests/fixtures/saju_golden_cases_v1.json"
      - "tests/test_saju_dual_verify.py"
      - "tests/test_saju_golden_replay.py"
      - "tests/test_run_saju_golden_replay.py"
      - "docs/final/artifacts/manseryeok_collision_dictionary_v1.json"
      - "docs/final/artifacts/schemas/saju_global_birth_request_v1.schema.json"
      - "docs/final/artifacts/schemas/saju_global_birth_result_v1.schema.json"
      - "tests/test_saju_birth_resolver_v1.py"
      - ".github/workflows/saju-dual-verify-gate.yml"
  pull_request:
    paths:
      - "scripts/saju_dual_verify.py"
      - "scripts/final_saju_verification.py"
      - "scripts/manseryeok_perfect_final.py"
      - "scripts/validate_ganji_mapping.py"
      - "scripts/validate_ephemeris_baseline.py"
      - "scripts/run_manseryeok_validation_smoke_v1.py"
      - "scripts/build_ganji_validation_cohort_v1.py"
      - "scripts/validate_collision_dictionary_v1.py"
      - "scripts/collision_dict_refresh_native_v1.py"
      - "scripts/sync_collision_dict_cohort_entries_v1.py"
      - "scripts/saju_birth_resolver_v1.py"
      - "scripts/run_saju_global_birth_v1.py"
      - "scripts/core/solar_term_ssot.py"
      - "scripts/core/solar_longitude_meeus_v1.py"
      - "scripts/core/boundary_risk_guard.py"
      - "scripts/run_saju_golden_replay.py"
      - "tests/fixtures/saju_golden_cases_v1.json"
      - "tests/test_saju_dual_verify.py"
      - "tests/test_saju_golden_replay.py"
      - "tests/test_run_saju_golden_replay.py"
      - "docs/final/artifacts/manseryeok_collision_dictionary_v1.json"
      - "docs/final/artifacts/schemas/saju_global_birth_request_v1.schema.json"
      - "docs/final/artifacts/schemas/saju_global_birth_result_v1.schema.json"
      - "tests/test_saju_birth_resolver_v1.py"
      - ".github/workflows/saju-dual-verify-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest-saju:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run saju dual verify + golden replay tests
        run: |
          python -m pytest \
            tests/test_saju_dual_verify.py \
            tests/test_saju_golden_replay.py \
            tests/test_run_saju_golden_replay.py \
            tests/test_saju_birth_resolver_v1.py \
            -q --tb=short
      - name: Enforce confirmed golden reference with fail-on-review
        run: |
          python scripts/saju_dual_verify.py \
            --year 1973 --month 12 --day 10 --hour 4 --minute 30 \
            --tz Asia/Seoul --solar --male --stdout-only --fail-on-review
      - name: Enforce zi_23 confirmed alignment with fail-on-review
        run: |
          python scripts/saju_dual_verify.py \
            --year 1973 --month 12 --day 10 --hour 23 --minute 31 \
            --tz Asia/Seoul --solar --male \
            --secondary-day-rollover-policy zi_23 \
            --stdout-only --fail-on-review
      - name: Replay golden fixtures gate report
        run: |
          python scripts/run_saju_golden_replay.py \
            --fixture tests/fixtures/saju_golden_cases_v1.json \
            --out docs/final/artifacts/saju_golden_replay_latest.json \
            --log docs/final/artifacts/saju_golden_replay_log.jsonl
      - name: Collision dictionary native checksum
        run: python scripts/validate_collision_dictionary_v1.py
      - name: Global birth CLI smoke (UTC + Seoul)
        run: |
          python scripts/run_saju_global_birth_v1.py \
            --utc-instant 1992-03-12T17:00:00Z --iana-tz Asia/Seoul --compact \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['resolution']['engine_inputs']['day']==13"

