# Template: copy to config/trading_config.yaml and tune. See repo config/trading_config.yaml for fee-aware defaults.
trading:
  check_interval_seconds: 600
  max_trades_per_day: 8
strategy:
  min_confidence: 0.66
  min_consecutive_signals: 2
  min_signal_bars: 16
  use_short_horizon_profile: false
  short_horizon_profile:
    min_confidence: 0.62
    min_consecutive_signals: 2
    min_signal_bars: 10
    max_position_size: 0.22
    fallback_min_diff_ratio: 0.0005
    fallback_leverage_multiplier: 0.4
  auto_profile_switch:
    enabled: true
    short_window_bars: 6
    long_window_bars: 180
    on_short_return_threshold: 0.0
    off_long_drawdown_threshold: 0.1
    off_long_return_threshold: -0.01
    switch_cooldown_bars: 1
risk_management:
  max_position_size: 0.24
  max_drawdown: 0.22
  risk_multiplier_min: 0.5
  risk_multiplier_max: 1.2
  max_daily_loss: 0.05
  stop_loss_ratio: 0.02
  take_profit_ratio: 0.06
