# Lens audio + video thin slice — include on jemaai.cloud when jemaai_public_showroom.conf
# already covers other showroom paths (avoids duplicate location blocks).
# Static files under /var/www/jemaai/

location = /public_showroom_lens_audio_thin_slice_v1.html {
    alias /var/www/jemaai/public_showroom_lens_audio_thin_slice_v1.html;
}
location = /public_showroom_lens_media_thin_slice_v1.html {
    alias /var/www/jemaai/public_showroom_lens_media_thin_slice_v1.html;
}
location = /showroom_lens_audio_thin_slice_v1.json {
    alias /var/www/jemaai/showroom_lens_audio_thin_slice_v1.json;
    add_header Cache-Control "no-store" always;
}
location = /showroom_lens_media_thin_slice_v1.json {
    alias /var/www/jemaai/showroom_lens_media_thin_slice_v1.json;
    add_header Cache-Control "no-store" always;
}
location = /jemaai_lens_audio_playback_lut_v1_latest.json {
    alias /var/www/jemaai/jemaai_lens_audio_playback_lut_v1_latest.json;
    add_header Cache-Control "no-store" always;
}
location = /jemaai_lens_video_playback_lut_v1_latest.json {
    alias /var/www/jemaai/jemaai_lens_video_playback_lut_v1_latest.json;
    add_header Cache-Control "no-store" always;
}
location = /jemaai_lens_video_playback_lut_v1.example.json {
    alias /var/www/jemaai/jemaai_lens_video_playback_lut_v1.example.json;
    add_header Cache-Control "no-store" always;
}
location ^~ /audio/lens_btrack/v1/ {
    alias /var/www/jemaai/audio/lens_btrack/v1/;
    add_header Cache-Control "public, max-age=604800" always;
    default_type audio/wav;
}
location ^~ /video/lens_btrack/v1/ {
    alias /var/www/jemaai/video/lens_btrack/v1/;
    add_header Cache-Control "public, max-age=604800" always;
    types {
        video/webm webm;
        video/mp4 mp4;
    }
    default_type video/webm;
}
