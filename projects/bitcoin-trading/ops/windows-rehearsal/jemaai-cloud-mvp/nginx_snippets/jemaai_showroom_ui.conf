# Include from api.jemaai.cloud server block, e.g.:
#   include /etc/nginx/snippets/jemaai_showroom_ui.conf;
# Static files live under /var/www/jemaai/

location = /public_showroom_poll.html {
    alias /var/www/jemaai/public_showroom_poll.html;
}
location = /public_showroom_board_minimal.html {
    alias /var/www/jemaai/public_showroom_board_minimal.html;
}
location = /public_showroom_topology_radar_v1.html {
    alias /var/www/jemaai/public_showroom_topology_radar_v1.html;
}
location = /character_profiles_v1_1.json {
    alias /var/www/jemaai/character_profiles_v1_1.json;
}
location = /action_book_v1.json {
    alias /var/www/jemaai/action_book_v1.json;
}
location = /showroom_public_bundle_v1.json {
    alias /var/www/jemaai/showroom_public_bundle_v1.json;
    add_header Cache-Control "no-store" always;
}
location = /showroom_topology_radar_snapshot_v1_latest.json {
