<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>jemaai public showroom (poll)</title>
  <style>
    :root { --bg:#0f1419; --fg:#e8ecf0; --muted:#8b98a5; --accent:#c9a227; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 1rem; max-width: 40rem; }
    h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    .badge { font-size: 0.75rem; padding: 0.25rem 0.5rem; border-radius: 999px; background: #1a222d; border: 1px solid #2b3846; color: var(--fg); }
    .badge.warn { border-color: rgba(233, 168, 0, 0.55); }
    .badge.ok { border-color: rgba(108, 191, 108, 0.55); }
    .badge.err { border-color: rgba(232, 93, 76, 0.6); }
    .ticker { background:#0f1419; border: 1px dashed #2b3846; border-radius: 12px; padding: 0.75rem; margin: 0.75rem 0 1rem; }
    .ticker .tline { font-size: 0.9rem; color: var(--fg); margin: 0; white-space: pre-wrap; word-break: break-word; }
    .chat { background:#0b1117; border: 1px solid #2b3846; border-radius: 12px; padding: 0.75rem; }
    .chat pre { background: transparent; padding: 0; margin: 0; white-space: pre-wrap; }
    .anim { transition: transform 250ms ease, filter 250ms ease; }
    .mode-idle { filter: saturate(1); }
    .mode-defend { filter: saturate(1.25); transform: translateY(-1px); }
    .mode-attack { filter: saturate(1.6); transform: translateY(-2px); }
    pre { background: #1a222d; padding: 0.75rem; border-radius: 8px; overflow: auto; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; }
    .err { color: #e85d4c; }
    .ok { color: #6cbf6c; }
    label { font-size: 0.75rem; color: var(--muted); }
    input { width: 100%; padding: 0.4rem; margin: 0.25rem 0 0.75rem; background: #1a222d; border: 1px solid #333; color: var(--fg); border-radius: 6px; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Public Showroom - Latest Poll</h1>
  <p class="sub">Default base URL is pinned to HTTPS API endpoint. Local fallback: <code>http://127.0.0.1:8788</code></p>

  <div class="row">
    <div class="badge ok" id="modeBadge">MODE: Idle</div>
    <div class="badge warn" id="riskBadge">RISK: WARNING</div>
    <div class="badge" id="dirBadge">DIR: HOLD</div>
  </div>

  <div class="ticker anim mode-idle" id="tickerBox">
    <p class="tline" id="tickerText">loading ticker...</p>
  </div>

  <div class="chat">
    <label for="chatOut" style="display:block; margin-bottom:0.25rem;">가상 채팅 (예능 반응)</label>
    <pre id="chatOut">loading chat...</pre>
  </div>

  <label for="base">GET Base (no trailing slash)</label>
  <input id="base" type="text" value="https://api.jemaai.cloud" autocomplete="off" />
  <p id="status" class="sub"></p>
  <pre id="out">loading...</pre>
  <script>
    const params = new URLSearchParams(location.search);
    const defaultBase = params.get("api") || "https://api.jemaai.cloud";
    document.getElementById("base").value = defaultBase;
    const POLL_MS = 20000;

    const chatLines = [];
    const chatMax = 10;
    let lastEventId = null;

    function modeFromEvent(obj) {
      const sys = (obj.system_status || "").toLowerCase();
      const risk = (obj.risk_level || "").toLowerCase();
      const dir = (obj.public_signal_direction || "").toUpperCase();
      if (sys === "maintenance") return "Defend";
      if (risk === "safe") return "Idle";
      if (risk === "warning") return "Defend";
      // Fallback: direction theme drives Attack vs Defend
      return (dir === "BUY" || dir === "LONG") ? "Attack" : "Defend";
    }

    function tickerLine(obj) {
      const sys = obj.system_status || "online";
      const risk = obj.risk_level || "WARNING";
      const dir = obj.public_signal_direction || "HOLD";
      const eid = obj.event_id || "";
      let delay = "";
      try {
        if (obj.delayed_metrics && typeof obj.delayed_metrics.delay_seconds === "number") {
          delay = ` | delay=${obj.delayed_metrics.delay_seconds}s`;
        }
      } catch (e) {}
      return `STATUS=${sys}  RISK=${risk}  DIR=${dir}  ${eid ? "eid="+eid : ""}${delay}`;
    }

    function pushChat(obj) {
      const mode = modeFromEvent(obj);
      const risk = obj.risk_level || "WARNING";
      const dir = obj.public_signal_direction || "HOLD";
      const status = obj.system_status || "online";

      const lines = [];
      if (status === "maintenance") lines.push("점검 모드! 픽셀 대원들이 방패를 올립니다.");
      if (risk === "SAFE") lines.push("안정 구간! 대원들이 숨을 고릅니다. (Idle)");
      if (risk === "WARNING") lines.push("경계 신호! Defend 모드 전환!");
      if (mode === "Attack") lines.push(`공세 모드! ${dir} 테마의 이펙트가 점화됩니다.`);
      if (mode === "Defend" && dir === "HOLD") lines.push("관찰 유지. 방어막은 계속 켜둡니다.");
      if (lines.length === 0) lines.push("상태 업데이트 감지! (예능 반응)");

      for (const l of lines.slice(0, 2)) chatLines.push(l);
      while (chatLines.length > chatMax) chatLines.shift();
      document.getElementById("chatOut").textContent = chatLines.join("\n");
    }

    async function tick() {
      const base = document.getElementById("base").value.replace(/\/$/, "");
      const url = base + "/api/public-events/latest";
      const st = document.getElementById("status");
      const out = document.getElementById("out");
      st.textContent = "GET " + url + " ...";
      try {
        const r = await fetch(url, { cache: "no-store" });
        const text = await r.text();
        if (!r.ok) {
          out.innerHTML = '<span class="err">HTTP ' + r.status + "</span>\n" + text;
          return;
        }
        let obj;
        try { obj = JSON.parse(text); } catch (e) {
          out.textContent = text;
          return;
        }

        // 예능형 표시 계층: 민감값 금지(whitelist only) & 상태 매핑만 수행
        const mode = modeFromEvent(obj);
        const modeBadge = document.getElementById("modeBadge");
        const riskBadge = document.getElementById("riskBadge");
        const dirBadge = document.getElementById("dirBadge");
        const tickerText = document.getElementById("tickerText");
        const tickerBox = document.getElementById("tickerBox");

        modeBadge.textContent = "MODE: " + mode;
        riskBadge.textContent = "RISK: " + (obj.risk_level || "WARNING");
        dirBadge.textContent = "DIR: " + (obj.public_signal_direction || "HOLD");
        tickerText.textContent = tickerLine(obj);

        tickerBox.classList.remove("mode-idle", "mode-defend", "mode-attack");
        tickerBox.classList.add(mode === "Idle" ? "mode-idle" : (mode === "Defend" ? "mode-defend" : "mode-attack"));

        if (obj.event_id && obj.event_id !== lastEventId) {
          lastEventId = obj.event_id;
          pushChat(obj);
        }

        st.innerHTML = '<span class="ok">ok</span> - ' + new Date().toISOString();
        out.textContent = JSON.stringify(obj, null, 2);
      } catch (e) {
        st.innerHTML = '<span class="err">network error</span>';
        out.textContent = String(e);
      }
    }
    tick();
    setInterval(tick, POLL_MS);
    document.getElementById("base").addEventListener("change", tick);
  </script>
</body>
</html>
