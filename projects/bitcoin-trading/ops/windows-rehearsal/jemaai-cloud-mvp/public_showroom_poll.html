<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>jemaai public showroom (poll)</title>
  <style>
    :root { --bg:#0f1419; --fg:#e8ecf0; --muted:#8b98a5; --accent:#c9a227; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 1rem; max-width: 40rem; }
    h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    .badge { font-size: 0.75rem; padding: 0.25rem 0.5rem; border-radius: 999px; background: #1a222d; border: 1px solid #2b3846; color: var(--fg); }
    .badge.warn { border-color: rgba(233, 168, 0, 0.55); }
    .badge.ok { border-color: rgba(108, 191, 108, 0.55); }
    .badge.err { border-color: rgba(232, 93, 76, 0.6); }
    .ticker { background:#0f1419; border: 1px dashed #2b3846; border-radius: 12px; padding: 0.75rem; margin: 0.75rem 0 1rem; }
    .ticker .tline { font-size: 0.9rem; color: var(--fg); margin: 0; white-space: pre-wrap; word-break: break-word; }
    .stage { background:#0b1117; border: 1px solid #2b3846; border-radius: 12px; padding: 0.75rem; margin: 0 0 0.75rem; }
    .stage canvas { width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; background: #0a0f14; border-radius: 8px; border: 1px solid #1d2a38; }
    .stage-meta { margin-top: 0.45rem; font-size: 0.78rem; color: var(--muted); }
    .chat { background:#0b1117; border: 1px solid #2b3846; border-radius: 12px; padding: 0.75rem; }
    .chat pre { background: transparent; padding: 0; margin: 0; white-space: pre-wrap; }
    .stage { margin: 0.75rem 0 1rem; padding: 0.75rem; border: 1px solid #2b3846; border-radius: 12px; background: radial-gradient(circle at 50% 10%, #1a222d, #0b1117); }
    .sprite-wrap { display:flex; align-items:center; gap:0.75rem; }
    .sprite { width: 96px; height: 96px; image-rendering: pixelated; object-fit: contain; border: 1px solid #2b3846; border-radius: 8px; background: #0f1419; }
    .sprite-meta { font-size: 0.8rem; color: var(--muted); }
    .sprite-anim-idle { animation: bob 1.8s ease-in-out infinite; }
    .sprite-anim-defend { animation: shake 0.5s ease-in-out infinite; }
    .sprite-anim-attack { animation: pulse 0.45s ease-in-out infinite; }
    @keyframes bob { 0%{transform:translateY(0)} 50%{transform:translateY(-3px)} 100%{transform:translateY(0)} }
    @keyframes shake { 0%{transform:translateX(0)} 25%{transform:translateX(-1px)} 50%{transform:translateX(1px)} 75%{transform:translateX(-1px)} 100%{transform:translateX(0)} }
    @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.06)} 100%{transform:scale(1)} }
    .anim { transition: transform 250ms ease, filter 250ms ease; }
    .mode-idle { filter: saturate(1); }
    .mode-defend { filter: saturate(1.25); transform: translateY(-1px); }
    .mode-attack { filter: saturate(1.6); transform: translateY(-2px); }
    pre { background: #1a222d; padding: 0.75rem; border-radius: 8px; overflow: auto; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; }
    .err { color: #e85d4c; }
    .ok { color: #6cbf6c; }
    label { font-size: 0.75rem; color: var(--muted); }
    input { width: 100%; padding: 0.4rem; margin: 0.25rem 0 0.75rem; background: #1a222d; border: 1px solid #333; color: var(--fg); border-radius: 6px; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Public Showroom - Latest Poll</h1>
  <p class="sub">Default base URL is pinned to HTTPS API endpoint. Local fallback: <code>http://127.0.0.1:8788</code></p>

  <div class="row">
    <div class="badge ok" id="modeBadge">MODE: Idle</div>
    <div class="badge warn" id="riskBadge">RISK: WARNING</div>
    <div class="badge" id="dirBadge">DIR: HOLD</div>
  </div>

  <div class="ticker anim mode-idle" id="tickerBox">
    <p class="tline" id="tickerText">loading ticker...</p>
  </div>

  <div class="stage">
    <label for="pixelStage" style="display:block; margin-bottom:0.35rem;">픽셀 캐릭터 스테이지 (v1)</label>
    <canvas id="pixelStage" width="256" height="144"></canvas>
    <div class="stage-meta" id="stageMeta">character=unknown_guard | mode=Idle</div>
  </div>

  <div class="chat">
    <label for="chatOut" style="display:block; margin-bottom:0.25rem;">가상 채팅 (예능 반응)</label>
    <pre id="chatOut">loading chat...</pre>
  </div>

  <label for="base">GET Base (no trailing slash)</label>
  <input id="base" type="text" value="https://api.jemaai.cloud" autocomplete="off" />
  <p id="status" class="sub"></p>
  <pre id="out">loading...</pre>
  <script>
    const params = new URLSearchParams(location.search);
    const defaultBase = params.get("api") || "https://api.jemaai.cloud";
    document.getElementById("base").value = defaultBase;
    const POLL_MS = 20000;

    const chatLines = [];
    const chatMax = 10;
    let lastEventId = null;
    const stageState = {
      obj: {},
      mode: "Idle",
      frame: 0,
      lastTs: 0,
      charId: "unknown_guard",
      pulse: 0,
    };
    const spriteByMode = {
      Idle: {
        name: "The Sovereign (Dragon)",
        url: "https://assets.jemaai.cloud/pixel_battalion/refined/generated_image_1774951700015_1.png"
      },
      Defend: {
        name: "Risk Guardian",
        url: "https://assets.jemaai.cloud/pixel_battalion/refined/generated_image_1774955383271_1.png"
      },
      Attack: {
        name: "Signal Alchemist",
        url: "https://assets.jemaai.cloud/pixel_battalion/refined/generated_image_1774955517797_1.png"
      }
    };
    const fallbackProfiles = {
      demo_guard: { archetype: "guardian", accent: "#6ccf95", eye: "#f6fbff" },
      unknown_guard: { archetype: "guardian", accent: "#77c6ff", eye: "#f6fbff" },
      bull_alpha: { archetype: "attacker", accent: "#ff8f80", eye: "#fff2d9" },
      bear_shield: { archetype: "defender", accent: "#ffc96c", eye: "#f4f8ff" }
    };
    let characterProfiles = { ...fallbackProfiles };
    const spriteCache = {};
    let activeSpriteUrl = "";

    function getSpriteImage(url) {
      if (!url) return null;
      if (!spriteCache[url]) {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = url;
        spriteCache[url] = img;
      }
      return spriteCache[url];
    }

    function colorFromCharacterId(rawId) {
      const id = String(rawId || "unknown_guard");
      let hash = 2166136261;
      for (let i = 0; i < id.length; i += 1) {
        hash ^= id.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      const hue = Math.abs(hash) % 360;
      return `hsl(${hue} 70% 58%)`;
    }

    async function loadCharacterProfiles() {
      try {
        const resp = await fetch("./character_profiles_v1_1.json", { cache: "no-store" });
        if (!resp.ok) return;
        const payload = await resp.json();
        if (payload && payload.profiles && typeof payload.profiles === "object") {
          characterProfiles = { ...fallbackProfiles, ...payload.profiles };
        }
      } catch (e) {
        // Keep fallback profiles.
      }
    }

    function profileFromCharacterId(rawId) {
      const id = String(rawId || "unknown_guard").toLowerCase();
      if (characterProfiles[id]) return characterProfiles[id];
      if (id.includes("bull") || id.includes("attack")) return characterProfiles.bull_alpha;
      if (id.includes("bear") || id.includes("shield") || id.includes("guard")) return characterProfiles.bear_shield;
      return characterProfiles.unknown_guard;
    }

    function drawPixelCharacter(ctx, x, y, scale, color, eyeShift, profile) {
      const p = (dx, dy, w = 1, h = 1, c = color) => {
        ctx.fillStyle = c;
        ctx.fillRect(x + dx * scale, y + dy * scale, w * scale, h * scale);
      };
      p(3, 0, 6, 1);
      p(2, 1, 8, 1);
      p(1, 2, 10, 1);
      p(1, 3, 10, 6);
      p(2, 9, 8, 1);
      p(3, 10, 6, 1);
      p(0, 4, 1, 3);
      p(10, 4, 1, 3);
      p(4 + eyeShift, 4, 1, 1, profile.eye || "#f6fbff");
      p(7 + eyeShift, 4, 1, 1, profile.eye || "#f6fbff");
      p(4 + eyeShift, 5, 1, 1, "#0a0f14");
      p(7 + eyeShift, 5, 1, 1, "#0a0f14");
      p(5, 7, 2, 1, "#0a0f14");
      p(4, 11, 1, 2, color);
      p(7, 11, 1, 2, color);
      p(2, 11, 1, 3, color);
      p(8, 11, 1, 3, color);
      // Shoulder accent to differentiate character profiles.
      p(1, 6, 1, 2, profile.accent || color);
      p(9, 6, 1, 2, profile.accent || color);
    }

    function drawStage(ts) {
      const canvas = document.getElementById("pixelStage");
      const meta = document.getElementById("stageMeta");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      if (!stageState.lastTs) stageState.lastTs = ts;
      const dt = ts - stageState.lastTs;
      stageState.lastTs = ts;
      stageState.pulse += dt * 0.004;
      stageState.frame += dt;

      const obj = stageState.obj || {};
      const mode = stageState.mode || "Idle";
      const risk = String(obj.risk_level || "WARNING").toUpperCase();
      const dir = String(obj.public_signal_direction || "HOLD").toUpperCase();
      const charId = String(obj.active_character_id || "unknown_guard");
      const charColor = colorFromCharacterId(charId);
      const profile = profileFromCharacterId(charId);
      const spriteInfo = spriteByMode[mode] || spriteByMode.Idle;
      const spriteImg = getSpriteImage(spriteInfo.url);
      activeSpriteUrl = spriteInfo.url;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0a0f14";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const wave = Math.sin(stageState.pulse);
      const bob = mode === "Attack" ? Math.sin(stageState.pulse * 1.9) * 4 : Math.sin(stageState.pulse * 1.2) * 2;
      const eyeShift = mode === "Attack" && dir !== "HOLD" ? (wave > 0 ? 1 : 0) : 0;

      ctx.fillStyle = "rgba(120,180,255,0.10)";
      for (let i = 0; i < 4; i += 1) {
        const y = 110 + i * 8 + Math.sin(stageState.pulse + i) * 2;
        ctx.fillRect(0, y, canvas.width, 2);
      }

      if (mode === "Defend") {
        ctx.strokeStyle = risk === "WARNING" ? "rgba(255, 188, 79, 0.80)" : "rgba(135, 225, 165, 0.70)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(128, 78 + bob, 38 + wave * 2, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (risk === "WARNING") {
        // Sweat particles for elevated risk.
        ctx.fillStyle = "rgba(119, 198, 255, 0.85)";
        for (let i = 0; i < 3; i += 1) {
          const sx = 98 + i * 12 + Math.sin(stageState.pulse + i) * 2;
          const sy = 56 + (i % 2) * 6 + Math.abs(Math.sin(stageState.pulse * 1.6 + i)) * 5;
          ctx.fillRect(sx, sy, 2, 3);
        }
      }

      if (mode === "Attack") {
        ctx.fillStyle = "rgba(255, 120, 120, 0.55)";
        const dirSign = (dir === "BUY" || dir === "LONG") ? 1 : -1;
        for (let i = 0; i < 4; i += 1) {
          const sx = 128 + (i * 18 + (stageState.frame * 0.04) % 22) * dirSign;
          const sy = 56 + i * 9;
          ctx.fillRect(sx, sy, 10, 2);
        }
      }

      if (spriteImg && spriteImg.complete && spriteImg.naturalWidth > 0) {
        const w = 72;
        const h = 72;
        const x = Math.floor((canvas.width - w) / 2);
        const y = Math.floor(44 + bob);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(spriteImg, x, y, w, h);
      } else {
        // Fallback while image is loading
        drawPixelCharacter(ctx, 106, 56 + bob, 4, charColor, eyeShift, profile);
      }

      meta.textContent = `character_id=${charId} (${profile.archetype}) | mode=${mode} | risk=${risk} | dir=${dir} | sprite=${spriteInfo.name}`;
      requestAnimationFrame(drawStage);
    }

    function modeFromEvent(obj) {
      const sys = (obj.system_status || "").toLowerCase();
      const risk = (obj.risk_level || "").toLowerCase();
      const dir = (obj.public_signal_direction || "").toUpperCase();
      if (sys === "maintenance") return "Defend";
      if (risk === "safe") return "Idle";
      if (risk === "warning") return "Defend";
      // Fallback: direction theme drives Attack vs Defend
      return (dir === "BUY" || dir === "LONG") ? "Attack" : "Defend";
    }

    function tickerLine(obj) {
      const sys = obj.system_status || "online";
      const risk = obj.risk_level || "WARNING";
      const dir = obj.public_signal_direction || "HOLD";
      const eid = obj.event_id || "";
      let delay = "";
      try {
        if (obj.delayed_metrics && typeof obj.delayed_metrics.delay_seconds === "number") {
          delay = ` | delay=${obj.delayed_metrics.delay_seconds}s`;
        }
      } catch (e) {}
      return `STATUS=${sys}  RISK=${risk}  DIR=${dir}  ${eid ? "eid="+eid : ""}${delay}`;
    }

    function pushChat(obj) {
      const mode = modeFromEvent(obj);
      const risk = obj.risk_level || "WARNING";
      const dir = obj.public_signal_direction || "HOLD";
      const status = obj.system_status || "online";

      const lines = [];
      if (status === "maintenance") lines.push("점검 모드! 픽셀 대원들이 방패를 올립니다.");
      if (risk === "SAFE") lines.push("안정 구간! 대원들이 숨을 고릅니다. (Idle)");
      if (risk === "WARNING") lines.push("경계 신호! Defend 모드 전환!");
      if (mode === "Attack") lines.push(`공세 모드! ${dir} 테마의 이펙트가 점화됩니다.`);
      if (mode === "Defend" && dir === "HOLD") lines.push("관찰 유지. 방어막은 계속 켜둡니다.");
      if (lines.length === 0) lines.push("상태 업데이트 감지! (예능 반응)");

      for (const l of lines.slice(0, 2)) chatLines.push(l);
      while (chatLines.length > chatMax) chatLines.shift();
      document.getElementById("chatOut").textContent = chatLines.join("\n");
    }

    async function tick() {
      const base = document.getElementById("base").value.replace(/\/$/, "");
      const url = base + "/api/public-events/latest";
      const st = document.getElementById("status");
      const out = document.getElementById("out");
      st.textContent = "GET " + url + " ...";
      try {
        const r = await fetch(url, { cache: "no-store" });
        const text = await r.text();
        if (!r.ok) {
          out.innerHTML = '<span class="err">HTTP ' + r.status + "</span>\n" + text;
          return;
        }
        let obj;
        try { obj = JSON.parse(text); } catch (e) {
          out.textContent = text;
          return;
        }

        // 예능형 표시 계층: 민감값 금지(whitelist only) & 상태 매핑만 수행
        const mode = modeFromEvent(obj);
        const modeBadge = document.getElementById("modeBadge");
        const riskBadge = document.getElementById("riskBadge");
        const dirBadge = document.getElementById("dirBadge");
        const tickerText = document.getElementById("tickerText");
        const tickerBox = document.getElementById("tickerBox");

        modeBadge.textContent = "MODE: " + mode;
        riskBadge.textContent = "RISK: " + (obj.risk_level || "WARNING");
        dirBadge.textContent = "DIR: " + (obj.public_signal_direction || "HOLD");
        tickerText.textContent = tickerLine(obj);

        tickerBox.classList.remove("mode-idle", "mode-defend", "mode-attack");
        tickerBox.classList.add(mode === "Idle" ? "mode-idle" : (mode === "Defend" ? "mode-defend" : "mode-attack"));
        stageState.obj = obj;
        stageState.mode = mode;
        stageState.charId = String(obj.active_character_id || "unknown_guard");

        if (obj.event_id && obj.event_id !== lastEventId) {
          lastEventId = obj.event_id;
          pushChat(obj);
        }

        st.innerHTML = '<span class="ok">ok</span> - ' + new Date().toISOString();
        out.textContent = JSON.stringify(obj, null, 2);
      } catch (e) {
        st.innerHTML = '<span class="err">network error</span>';
        out.textContent = String(e);
      }
    }
    requestAnimationFrame(drawStage);
    loadCharacterProfiles().finally(() => {
      tick();
      setInterval(tick, POLL_MS);
      document.getElementById("base").addEventListener("change", tick);
    });
  </script>
</body>
</html>
