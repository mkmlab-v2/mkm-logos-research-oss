<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>jemaai ??public showroom (poll)</title>
  <style>
    :root { --bg:#0f1419; --fg:#e8ecf0; --muted:#8b98a5; --accent:#c9a227; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 1rem; max-width: 40rem; }
    h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
    pre { background: #1a222d; padding: 0.75rem; border-radius: 8px; overflow: auto; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; }
    .err { color: #e85d4c; }
    .ok { color: #6cbf6c; }
    label { font-size: 0.75rem; color: var(--muted); }
    input { width: 100%; padding: 0.4rem; margin: 0.25rem 0 0.75rem; background: #1a222d; border: 1px solid #333; color: var(--fg); border-radius: 6px; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>?⑤벀而???곤폍 ??latest ??彛?/h1>
  <p class="sub">Polling UI ??Base URL??濡쒖뺄濡?媛뺤젣(湲곕낯媛??⑸땲?? 湲곕낯: <code>http://127.0.0.1:8788</code></p>
  <label for="base">GET Base (no trailing slash)</label>
  <input id="base" type="text" value="http://api.jemaai.cloud" autocomplete="off" />
  <p id="status" class="sub"></p>
  <pre id="out">loading...</pre>
  <script>
    const params = new URLSearchParams(location.search);
    const defaultBase = params.get("api") || "http://api.jemaai.cloud";
    document.getElementById("base").value = defaultBase;
    const POLL_MS = 20000;
    async function tick() {
      const base = document.getElementById("base").value.replace(/\/$/, "");
      const url = base + "/api/public-events/latest";
      const st = document.getElementById("status");
      const out = document.getElementById("out");
      st.textContent = "GET " + url + " ...";
      try {
        const r = await fetch(url, { cache: "no-store" });
        const text = await r.text();
        if (!r.ok) {
          out.innerHTML = '<span class="err">HTTP ' + r.status + "</span>\n" + text;
          return;
        }
        let obj;
        try { obj = JSON.parse(text); } catch (e) {
          out.textContent = text;
          return;
        }
        st.innerHTML = '<span class="ok">ok</span> ' + new Date().toISOString();
        out.textContent = JSON.stringify(obj, null, 2);
      } catch (e) {
        st.innerHTML = '<span class="err">network error</span>';
        out.textContent = String(e);
      }
    }
    tick();
    setInterval(tick, POLL_MS);
    document.getElementById("base").addEventListener("change", tick);
  </script>
</body>
</html>
