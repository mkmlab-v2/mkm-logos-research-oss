# Example Prometheus scrape config for bitcoin_trading_daemon /metrics.
# Copy to your Prometheus server and adjust targets (host:port).
#
# Default exporter port: MKM_PROMETHEUS_METRICS_PORT=9108
# Disable: MKM_PROMETHEUS_METRICS_PORT=0
#
# After reload:
#   promtool check config prometheus.yml
#   curl -s localhost:9108/metrics | findstr mkm_trading
#
# Traces (optional): MKM_OTEL_ENABLED=1 + OTLP endpoint; see trading_otel.py and requirements-optional-otel.txt.

global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: mkm-bitcoin-trading-daemon
    static_configs:
      - targets:
          - 127.0.0.1:9108
        labels:
          env: local
          service: bitcoin-trading-daemon
