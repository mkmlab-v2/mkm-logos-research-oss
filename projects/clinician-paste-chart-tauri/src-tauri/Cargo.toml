[package]
name = "clinician_paste_chart_tauri"
version = "0.1.0"
description = "MKM Paste Chart Tauri shell"
authors = ["MKM"]
edition = "2021"

[lib]
name = "clinician_paste_chart_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
dotenvy = "0.15"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
