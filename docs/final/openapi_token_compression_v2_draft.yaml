openapi: 3.0.3
info:
  title: MKM Token Compression API (v2 draft — Trust Packet)
  version: "0.1.0-draft"
  description: |
    **Reference implementation (experimental stub):** `scripts/compression_token_api_v2_stub.py` — `POST /v2/compress`,
    `POST /v2/expand`, `GET /health` (e.g. uvicorn on port 8011). Compress path uses `evaluate_report` + domain router
    (same family as v1 live hydration); not a production SLA.

    Purpose: compress returns a structured `compression_packet` (compressed text + residual metadata for reassembly)
    and expand consumes that packet — not a v1-style echo of raw text only.

    Design goals (see docs/final/COMPRESSION_INTERPRETATION_PIPELINE_FACT_LOCK_2026-03-31.md §11):
    - Stateless server: the packet (including residuals) is returned to the client; persistence and key management
      are the client's responsibility. TLS in transit; treat packet as sensitive data.
    - `packet_format_version` allows engine evolution without breaking old clients.
    - `loss_profile` separates semantic general text vs code-equivalence KPIs (Phase 3 roadmap).

    Current production-like stub remains: docs/final/openapi_token_compression_stub_v1.yaml (POST /v1/*).

    **Operator guide (4-Cell, Korean digest — no separate MD):**
    `reports/constitution/btrack_pilot/comp_atom05_profile_matrix_brief_v1.json` → `operator_guide_ko`,
    `profile_presets`, `pitfalls` (regenerate: `py scripts/comp_atom05_profile_matrix_brief_v1.py`).

    **Profile presets (bench full_v2_40, research_only):**
    | Preset | compression_profile | graph_wire_selective_bridge | Bench headline (aggregate) |
    |--------|---------------------|-----------------------------|----------------------------|
    | Track A frozen | economy | false | ~47.5% saving / Jaccard ~0.890 |
    | B-track v2 recommended | economy | true | ~47.1% saving / Jaccard ~0.897 |
    | Fidelity (human gate) | fidelity | n/a | ~32.2% saving / Jaccard ~0.967 |

    **Pitfalls:** Do not assume every `POST /v2/compress` returns 47.1%/0.897 — only ~9/40 bench cases get
    `bridge_boost`; per-text scores vary. Wire is not must_keep graph word paste — see
    `semantic_pointer.graph_wire_influence_v1`. Do not auto-promote economy+wire into Track A active report.

    Versioning: bump draft `info.version` until first implementation; then align `api_contract_version` inside
    packets with MINOR/MAJOR rules agreed for v2.
servers:
  - url: http://127.0.0.1:8011
    description: Local v2 stub (example — same app can be deployed elsewhere)
paths:
  /v2/compress:
    post:
      operationId: compressTextV2
      summary: Compress text and return a Trust Packet (stub implementation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompressRequestV2"
            examples:
              track_a_frozen_economy:
                summary: Track A frozen (economy, wire OFF)
                value:
                  text: "Example document body for compression."
                  loss_profile: semantic_general
                  compression_profile: economy
                  graph_wire_selective_bridge: false
                  emit_semantic_pointer: false
                  client_request_id: "req-v2-track-a"
              btrack_recommended_hybrid:
                summary: B-track v2 draft recommended (economy + selective wire)
                value:
                  text: "Example document body for compression."
                  loss_profile: semantic_general
                  compression_profile: economy
                  graph_wire_selective_bridge: true
                  emit_semantic_pointer: true
                  client_request_id: "req-v2-btrack-wire"
      responses:
        "200":
          description: OK (draft schema)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompressResponseV2"
        "501":
          description: Reserved (not used by current stub)
  /v2/expand:
    post:
      operationId: expandPacketV2
      summary: Reconstruct text from a Trust Packet only (stub implementation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpandRequestV2"
            example:
              compression_packet:
                packet_format_version: "trust_packet.0.1"
                api_contract_version: "2.0.0-draft"
                loss_profile: semantic_general
                compressed_text: "…"
                residual_meta:
                  placeholder_map: {}
                router_meta:
                  shard_id: zone_d_ssot
                  domain: ssot
      responses:
        "200":
          description: OK (draft schema)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpandResponseV2"
        "501":
          description: Reserved (not used by current stub)
  /health:
    get:
      operationId: healthV2
      summary: Liveness (optional shared with v1)
      responses:
        "200":
          description: OK
  /v1/research/mkm_lexicon_wire/encode:
    post:
      operationId: encodeMkmLexiconWire
      summary: "[research_only] atom_id_sequence on adaptive msgpack wire"
      description: |
        Research lane only. Encodes ordered 41k lexicon atom_ids (from `text` or explicit
        `atom_id_sequence`). Not production SLA; not live trading. See
        `scripts/compression_token_api_v2_stub.py`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MkmLexiconWireEncodeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MkmLexiconWireEncodeResponse"
  /v1/research/mkm_lexicon_wire/decode:
    post:
      operationId: decodeMkmLexiconWire
      summary: "[research_only] decode lexicon wire blob"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MkmLexiconWireDecodeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MkmLexiconWireDecodeResponse"
  /v1/research/mkm_inter_agent_wire/turn:
    post:
      operationId: sendMkmWireTurnV1
      summary: "[research_only] one A2A turn as wire envelope v1"
      description: |
        Wraps lexicon wire encode into `mkm_inter_agent_wire_envelope_v1` turn JSON.
        Wire-first path (M6/M7); not full Trust Packet on-wire. B-track only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MkmWireTurnRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MkmWireTurnResponse"
components:
  schemas:
    LossProfile:
      type: string
      description: |
        Selects evaluation KPIs and allowed transforms. `code_equivalent` implies build/parse equivalence goals,
        not headline token savings.
      enum:
        - lossless_text
        - semantic_general
        - code_equivalent
    ResidualMeta:
      type: object
      description: |
        Opaque-to-contract structure for reassembly (token maps, immutable fragments, hashes). Exact keys are
        engine-specific; clients must store the whole object and return it to expand unchanged.
        Current stub may include `mk_stub_v2.semantic_pointer` (`schema: semantic_pointer_v1`) when
        compress request sets `emit_semantic_pointer=true`.
      additionalProperties: true
    RouterMeta:
      type: object
      description: Echo of routing outcome for client-side logging and A/B routing.
      additionalProperties: true
      properties:
        shard_id:
          type: string
        domain:
          type: string
    CompressionPacket:
      type: object
      required:
        - packet_format_version
        - api_contract_version
        - loss_profile
        - compressed_text
        - residual_meta
      properties:
        packet_format_version:
          type: string
          description: Logical packet layout version (e.g. trust_packet.0.1).
          example: "trust_packet.0.1"
        api_contract_version:
          type: string
          description: Semver for this HTTP JSON shape (may track OpenAPI info.version after stabilization).
          example: "2.0.0-draft"
        loss_profile:
          $ref: "#/components/schemas/LossProfile"
        compressed_text:
          type: string
          description: Short form produced by the compression engine for LLM or storage.
        residual_meta:
          $ref: "#/components/schemas/ResidualMeta"
        router_meta:
          $ref: "#/components/schemas/RouterMeta"
        content_fingerprint:
          type: string
          description: Optional stable hash of original input for client-side dedup/verification (algorithm TBD).
    CompressRequestV2:
      type: object
      required: [text, loss_profile]
      properties:
        text:
          type: string
        loss_profile:
          $ref: "#/components/schemas/LossProfile"
        compression_profile:
          type: string
          enum: [economy, fidelity, literal]
          default: economy
          description: |
            Product tier mapped to evaluate_report bench config (Fact-Lock).
            economy = bridge OFF (Track A frozen ~47.5% / Jaccard ~0.890 on comp_atom01 control).
            fidelity = bridge ON (~32.2% / ~0.967). literal = conservative caps (~23.6% / ~0.975).
            SSOT: scripts/compression_profile_v1.py · reports/constitution/btrack_pilot/comp_4d_anchor_ssot_v1.json
        locale:
          type: string
          description: Optional BCP-47 hint
        client_request_id:
          type: string
        notes:
          type: string
          description: Optional correlation string; not used for compression logic in v2 draft.
        emit_semantic_pointer:
          type: boolean
          default: false
          description: |
            If true, evaluate_report runs with semantic pointer emission and the first case pointer
            is attached at `compression_packet.residual_meta.mk_stub_v2.semantic_pointer`.
        graph_wire_selective_bridge:
          type: boolean
          default: false
          description: |
            B-track COMP-ATOM-05 (research). When true with atom-network GraphRAG available,
            per-request graph route may set `bridge_boost` and enable per-case 4D bridge policy
            without global `compression_profile=fidelity`. Does not change Track A economy default.
            Wire metadata at `semantic_pointer.graph_wire_influence_v1`; optional
            `integrity_flags.graph_wire_influence_v1` / `graph_wire_bridge_boost`.
            Bench matrix: `reports/constitution/btrack_pilot/comp_atom05_profile_matrix_sweep_v1.json`.
            Operator digest: `comp_atom05_profile_matrix_brief_v1.json` (`operator_guide_ko`, `profile_presets`).
            With `compression_profile: economy`, stub uses `profile_evaluate_report_kwargs_v2`
            (bench `_base_eval_kwargs` + global bridge OFF) so per-case wire is not zeroed by economy profile caps.
            **Not** a guarantee of bench-aggregate 47.1%/0.897 on every request.
            **No-op guard:** If GraphRAG/atom-network is unavailable, graph route misses, or integration
            strips Gematria/4D bridge metadata on the runtime path, `graph_wire_selective_bridge=true` yields
            no `bridge_boost` (same effective behavior as `false`). Default remains `false` for Track A parity.
            Staging scope SSOT: `reports/constitution/btrack_pilot/comp_v2_wire_staging_promotion_scope_v1.json`.
        stateless_packet:
          type: boolean
          default: false
          description: |
            Trust Packet Stateless Profile (DoD ②). When true, `compression_packet.residual_meta.mk_stub_v2`
            omits `reconstructed_text` (no full-text leak). Pair with `POST /v2/expand` and
            `decode_mode=codebook_only` for round-trip. Allowed structured residual may include
            `hybrid_codec_v0_payload`, `mkm_lexicon_rail_v1`, `placeholder_map`, metrics fields.
        forced_shard_id:
          type: string
          description: |
            Optional forced domain shard (e.g. B2B catalog `zone_*_b2b_v1`). Skips keyword scoring;
            uses `DomainSpecificRouter.route_from_shard_id`. B2B shards under `codebook/shards/b2b/`
            are catalog-only and do not participate in default auto-routing. Research/B2B PoC only —
            not a Track A frozen bench or customer SLA claim.
        corpus_tag:
          type: string
          description: |
            Hybrid router corpus tag (research_only). Resolves profile/shortcap/overlay overrides from
            `docs/final/artifacts/compression_hybrid_router_spec_v1.json`. External backends (e.g.
            `llmlingua2`) return HTTP 422 with `recommended_backend` — stub does not invoke them.
        sku_class:
          type: string
          enum: [coord, mask]
          description: |
            Optional SKU class hint. `coord` = pointer/inject pre-sync (SKU-COORD); `mask` = masked
            JSONL + v2/hybrid (SKU-MASK). Default from binding table when omitted.
        enable_coding_deep_pack:
          type: boolean
          default: false
          description: |
            B-track [HYPO]: zone_f_code template-catalog wire (`ZF_MASK`) when input matches
            `codebook/templates/zone_f_code_templates_v1.jsonl` (exact or literal-slot variant).
            Also auto-enabled when `sku_class=mask` and routed shard is `zone_f_code`. Pair expand
            with default `decode_mode=stub`; emits `integrity_flags.coding_deep_pack_wire_v1`.
            research_only · not Track A ACTIVE · not customer SLA.
        enable_en_business_deep_pack:
          type: boolean
          default: false
          description: |
            B-track [HYPO]: zone_h_en_business formal template-catalog wire (`BIZ_MASK`) when input
            matches `codebook/templates/zone_h_en_business_templates_v1.jsonl`. Also auto-enabled
            when `sku_class=mask` and routed shard is `zone_h_en_business_v1`. Pair expand with
            default `decode_mode=stub`; emits `integrity_flags.en_business_deep_pack_wire_v1`.
            research_only · not Track A ACTIVE · not customer SLA.
        enable_ko_premium_cs_deep_pack:
          type: boolean
          default: false
          description: |
            B-track [HYPO]: zone_ko_premium_cs masked Korean CS template wire (`CS_MASK`) when input
            matches `codebook/templates/zone_ko_premium_cs_templates_v1.jsonl`. Also auto-enabled
            when `sku_class=mask` and routed shard is `zone_ko_premium_cs_v1`. Mask tokens (███) must
            exact-restore. Pair expand with default `decode_mode=stub`; emits
            `integrity_flags.ko_premium_cs_deep_pack_wire_v1`. research_only · not Track A ACTIVE.
    CompressResponseV2:
      type: object
      required: [compression_packet, integrity_flags]
      properties:
        compression_packet:
          $ref: "#/components/schemas/CompressionPacket"
        compression_metrics:
          $ref: "#/components/schemas/CompressionMetricsV2"
        integrity_flags:
          type: object
          additionalProperties: true
          description: Diagnostics (latency_ms, engine_id, warnings).
    CompressionMetricsV2:
      type: object
      nullable: true
      description: Optional token/byte proxies — same spirit as v1; nullable when engine does not compute.
      properties:
        token_in:
          type: integer
          minimum: 0
        token_out:
          type: integer
          minimum: 0
        savings_ratio:
          type: number
    ExpandRequestV2:
      type: object
      required: [compression_packet]
      properties:
        compression_packet:
          $ref: "#/components/schemas/CompressionPacket"
        decode_mode:
          type: string
          enum: [stub, l1_experimental, codebook_only]
          default: stub
          description: |
            stub = may read `mk_stub_v2.reconstructed_text` when present.
            codebook_only = Trust Packet Stateless Profile; no full-text residual; uses
            compressed_text + router_meta + allowed structured residual only.
            l1_experimental = research_only beam decode on compressed_text.
    ExpandResponseV2:
      type: object
      required: [text, integrity_flags]
      properties:
        text:
          type: string
          description: Reconstructed text per loss_profile guarantees (documented per engine release).
        api_contract_version:
          type: string
          example: "2.0.0-draft"
        integrity_flags:
          type: object
          additionalProperties: true
          description: e.g. reassembly_ok, warnings, jaccard_proxy
    MkmLexiconWireEncodeRequest:
      type: object
      properties:
        text:
          type: string
          description: Source text; atom_ids resolved via master_codebook_lexicon_v1 bridge.
        atom_id_sequence:
          type: array
          items:
            type: string
          description: Optional explicit atom_id list (skips text resolution).
        zstd_min_raw_bytes:
          type: integer
          minimum: 0
          default: 64
        zstd_level:
          type: integer
          minimum: 1
          maximum: 22
          default: 3
    MkmLexiconWireEncodeResponse:
      type: object
      properties:
        schema:
          type: string
          example: mkm_lexicon_wire_encode_v1
        wire_b64:
          type: string
        wire_byte_len:
          type: integer
        codec_variant:
          type: string
        atom_id_sequence:
          type: array
          items:
            type: string
        lexicon_meta:
          type: object
          additionalProperties: true
        integrity_flags:
          type: object
          additionalProperties: true
    MkmLexiconWireDecodeRequest:
      type: object
      required: [wire_b64]
      properties:
        wire_b64:
          type: string
    MkmLexiconWireDecodeResponse:
      type: object
      properties:
        schema:
          type: string
        payload:
          type: object
          additionalProperties: true
        atom_id_sequence:
          type: array
          items:
            type: string
        integrity_flags:
          type: object
          additionalProperties: true
    MkmWireTurnRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        session_id:
          type: string
        turn_id:
          type: integer
          minimum: 1
          default: 1
        from_agent:
          type: string
        to_agent:
          type: string
        loss_profile:
          type: string
        routing_profile:
          type: string
        zstd_min_raw_bytes:
          type: integer
          minimum: 0
          default: 0
    MkmWireTurnResponse:
      type: object
      properties:
        envelope_schema:
          type: string
          example: mkm_inter_agent_wire_envelope_v1
        envelope:
          type: object
          additionalProperties: true
        envelope_utf8_byte_len:
          type: integer
        integrity_flags:
          type: object
          additionalProperties: true
